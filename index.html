<script>
window.DECK = {

  // 슬라이드 비율 '16:9' | '16:10' | '4:3' | 'full'

  //          창을 줄이면 비율을 유지하며 축소됩니다.
  //   PDF 쪽 크기도 이 값을 따라갑니다.
  ratio:   '16:9',

  // 슬라이드 크기 그대로의 흰 종이를 회색 바탕 위에 띄운다.

  // 세로 정렬 'top' | 'center'   ('center' 가 reveal 기본값)
  //   슬라이드별로 뒤집기: <section class="center"> / <section class="top">
  valign:  'top',

  // 가로 정렬 'left' | 'center' | 'right'   ('center' 가 reveal 기본값)
  //   어디서든 뒤집기 — 제목 중괄호 `## 제목 {.tcenter}` · 열 `{.column .tright}`
  //   · 덩어리 `::: {.tright}`. 양끝맞춤은 .tjustify
  halign:  'left',

  // 어떤 제목 레벨이 슬라이드를 가르는가
  //   sectionLevel = 간지(부 표지) · slideLevel = 일반 슬라이드
  //   더 깊은 제목(###…)은 슬라이드 안의 소제목으로 남습니다.
  //   문서가 ## 부터 시작하는 구조면 2/3 으로 한 단계씩 내리면 됩니다.
  sectionLevel: 1,
  slideLevel:   2,

  // 그림 캡션에 "그림 1." 번호를 붙일지. 라벨은 deck.css 의 --fig-label

  chapnav: true,   // 상단 챕터 내비 (클릭하면 해당 간지로 이동)
  footer:  true,   // 하단 행사·연사·일자·쪽번호

  meta: {
    title:   'AI 시대, 빠르고 안전한 앱 프로토타입',
    event:   '출연연 오픈소스 테크데이 2026',
    date:    '2026. 10. 7.',
    speaker: '장민석 (msjang@kisti.re.kr)',
  },
};

// CSS 가 읽을 수 있게 <html> 에 클래스로 찍는다 (렌더 전이라 깜빡임 없음)
document.documentElement.className = [
  DECK.paper ? 'paper' : '',
  'v-' + DECK.valign,
  'h-' + DECK.halign,
  DECK.figureNumber ? 'fignum' : '',
  DECK.chapnav ? '' : 'no-chapnav',
  DECK.footer  ? '' : 'no-footer',
].filter(Boolean).join(' ');
</script>

## 섀도우 IT <sup>Shadow IT</sup> 가 뭐냐면

::: {.callout .info}
**부서의 승인, 인지 또는 감독 없이\
엔터프라이즈 네트워크에서 사용되는 모든 소프트웨어·하드웨어**
:::

- **PoC <sup>개념검증, 사전검증</sup> 는 성격상 섀도우에 가깝습니다.**<br/>승인 전에 만들어봐야 승인 여부를 정할 수 있으니까요
- 즉 섀도우 IT는 예외가 아니라, **모든 새 시스템이 거쳐가는 단계**입니다

::: {.callout .warn}
그러면 질문이 바뀝니다\
— "막을 것인가"가 아니라 **"어떻게 양지로 올릴 것인가"**
:::

::: notes
섀도우 IT 가 뭐냐면
부서의 승인없이 사용되는 모든 소프트웨어와 하드웨어 입니다.

그림자가 까만 색이잖아요. 그런데 이게 나쁘다는게 아닙니다.
그런데 대부분의 IT는 셰도우를 거칩니다.
승인 전에 만들어봐야 승인 여부를 정할 수 있으니까요.

그러면 집중해야 할 게 명확해지죠
아직 모르는 섀도우 IT가 많거든요.
이걸 어떻게 양지로 올릴 것인가가 중요하다는 겁니다.
:::

## 더 이른 학술정보 공유 이야기 - 유즈넷 <sup>Usenet</sup> {.center}

- 1981년 시작된 뉴스 서비스 <sup>웹(WWW)보다 10년 먼저 시작</sup>
- `han.comp.lang.c` <sup>한국어.컴퓨터.언어.C</sup> 처럼 계층적으로 이름을 붙인 그룹에 게시
- 사용자가 가까운 위치의 뉴스서버에 게시하면\
  피어 서버를 통해 전세계 모든 뉴스서버가 동기화 되며 뉴스가 전달되는 구조
- 메일링 리스트와 영향을 주고 받으며, 웹 포럼 <sup>BBS · 레딧 · Discourse</sup> 으로 이어진 계보

::: punch
중앙 서버도, 운영 회사도, 가입 심사도 없는 **탈중앙화 구조**
:::


::: notes
공유폴더 이야기 했으니, 
또 다른 정보 공유 이야기를 해 볼게요
유즈넷 들어보신 적 있으신가요?
80년도에 인터넷보다 먼저 시작됬고요
오늘날의 메일링 리스트와 웹 포럼에 지대한 영향을 끼친 서비스 입니다.
:::

## 고립이 면죄부입니다 {.fit}

실험장비에서 데이터를 빼내려면 옆에 **ADC · 라즈베리파이**를 붙입니다. 그 순간 —

| | 보안성 검토 |
|---|---|
| 제조사 완제품, **네트워크 미연결** | **대상 아님** — 기납품이라 변경 불가<br>*그 안에서 20년 된 WinXP 가 돌고 있어도* |
| 거기에 **계측 게이트웨이**를 붙임 | **비인가 외부 장치 → 풀스캔**<br>기준이 매년 바뀌어 **작년 소명서를 못 씁니다** |
| 그 게이트웨이를 **검사하려면** | 스캐너 · 에이전트가 **x86 서버용**입니다 |

::: {.callout .warning}
계측 게이트웨이는 **ARM · RISC-V** 입니다. \
검사를 돌리겠다고 라이브러리를 욱여넣으면 — **임베디드의 장점인 최소 공격면을 스스로 버립니다**
:::

## 가장 강하게 나눈 곳에서도 {.fit}

**망분리** 기관이 있습니다 — 내부망과 외부망을 아예 따로 둡니다

| | 내부망 | 외부망 |
|---|---|---|
| **데이터** | 반출 금지 대상 | 공개 가능한 **시뮬레이터 · 형상** |
| **연구** | 소 안에서만 | **노트북 반출 · 웹메일 가능** |
| **합치는 길** | ← **망간접점 시스템으로 밀어넣기** | |

::: {.callout .notice}
노트북이 나가고 웹메일이 되는 건 통제가 느슨해서가 아닙니다. \
**외부망 기준**이라 그렇습니다. — 밖에 있는 건 **이미 밖에 있어도 된다고 분류를 통과한 것**입니다
:::

::: {.callout .warning}
**그런데 개인 단말은 여기서도 들어옵니다.** \
망분리가 막는 건 `내부망 연결`이지 `반입`이 아닙니다. 내부망에서 작업하면서 **개인 폰으로 전화 받습니다**
:::

::: {.callout .question}
**그리고 연구는 칼로 두부 자르듯 나뉘지 않습니다.** \
아르키메데스는 목욕탕에서 풀었습니다. 요즘 연구자는 사비를 들여 GPU 데탑을 집에 마련하고, **Claude Code 을 원격으로 걸어두고, \
화장실에서도 피드백을 받습니다.** 그리고 그 결과를 들고 월요일에 들어옵니다
:::

::: punch
밖에서 하는 건 일탈이 아니라 **연구 연속성**입니다.
막은 건 **데이터지 머리가 아닙니다**
:::

::: notes
출연연 중에서도 망분리 된 기관들이 있어요.
거긴 연구 자체를 나눠서 합니다. 내부망에서 할 연구, 외부망에서 할 연구.

가지고 나오면 안 되는 데이터로 하는 연구는 소 안에서 하고요.

그 연구소에서도 노트북 반출 되고 웹메일 되거든요?
이건, 통제가 허술해서가 아니라 **외부망 기준**이라 그래요.
밖에 있는 건 이미 밖에 있어도 된다고 분류를 통과한 겁니다.

그래서 보통은 공개 가능한 시뮬레이터나 형상으로 밖에서 연구하고,
망간접점 시스템으로 내부망에 밀어 넣는 식이에요.

게다가 개인 단말은 가지고 들어갈 수 있거든요?
망분리는 망을 나눈 거지 반입을 막은 게 아니에요.
내부망 PC 앞에서 작업하면서 개인 폰으로 전화 받으면서 일해요.

그리고 사람이 칼로 두부 자르듯이 딱 나눠서 연구가 안 돼요.
아르키메데스도 목욕하다 유레카 했잖아요. 연구자도 그래요.
집에 아이맥이나 GPU 데스크탑 맞춰 놓고, Codex·Claude Code 원격으로 걸어두고,
화장실에서도 AI랑 피드백 받으면서 연구해요. 그리고 그 결과를 들고 들어옵니다.
:::

그런데 진짜 가치는 내부데이터로, 
내부에 주소를 만들고, 팀과 조직의 업무능률을 향상시키는 겁니다.
근데 여기까지 간 경우를 보지를 못했습니다.





- ⚠ **로컬 도구 칸(왼쪽)을 「본인 한 명에서 끝」이라고 하면 틀린다.** standalone 도 퍼진다 —
  배포 단위가 *실행 중인 인스턴스*가 아니라 **패키지**이기 때문이다.
  승인이 필요 없는 이유도 같다. 서버가 없다
- **KorDoc 은 반례가 아니라 증거다.** 이 장을 「안 됩니다」로만 끌면 방이 식는데,
  「이건 됩니다, 이미 하고 계십니다」가 하나 있으면 뒤의 **빈 칸**이 더 믿긴다
- 실명 표기는 보류했다. **「류 주임님이 만드신 KorDoc」은 입으로** 하실지 정하실 것 —
  공개 오픈소스라 문제는 없지만 동료 이름을 화면에 박는 건 본인 판단
- 핵심은 **빈 칸의 정의가 날카로워진다는 것** — 그 칸은 「내부 데이터」가 아니라
  **「내부 데이터 × 같이 보는 것」**이다. 18번 요구사항이 전부 거기 있다

**1-4 · 4막 3/3** · `CORE`
- ⚠ 가로축(주소 있음/없음)은 **여기서 처음 나온다.** 「주소 = 손잡이」는 4부에서 정의하므로
  여기선 설명 없이 "가리킬 수 있느냐"로만 읽을 것
- **파란 상자를 천천히 읽을 것.** 가로축이 왜 중요한지가 거기 있다 —
  판단 없이 되는 영역이 「혼자 · 외부 통신 없음 · 서버 없음」뿐이라,
  **남에게 보여주려는 순간 전부 신고 대상**이 된다. 오른쪽 칸이 좁은 게 아니라
  **왼쪽으로 가는 문턱이 높은** 것이다
- 가리킬 자리 = 주소 + 신원 + 데이터. 셋이 다 있어야 조직 자산
- GitHub Pages는 주소만, 로컬 앱은 데이터만. 빠진 건 신원(SSO) — 개인이 혼자 못 푸는 유일한 요소
- 기관 AX 사례집 한 장 띄우고 "전부 왼쪽 위 칸입니다"
- 3부 SADP 가 이 빈 칸을 채우는 것. **5부 ②**가 왼쪽 위를 합법화하는 것
:::

::: notes
**2-1 · 위협 1/2** · `CORE`
- **"랜섬웨어가 줄었다"고 말하지 말 것.** 공격 건수는 오히려 최고치. 줄어든 건 지불액
- 출처: Chainalysis 2025 Crypto Crime Report ($1.25B → $813M, 35.82%↓). 2024 하반기 요구액 대비 지불액 격차 53%
- 원인은 피해자가 안 냄 + 제재·법집행(Chipmixer, Tornado Cash, Sinbad, Cryptex)
- GPU 채굴 캠페인은 Microsoft 보안 블로그 사례 — ScreenConnect·.NET 악용, AI 챗봇으로 악성 다운로드 유도
- 이 장이 2부 전체의 정당화. "왜 아웃바운드부터 막느냐"의 답
:::


## 그래서 연구소에서 무서운 건 둘입니다

- **"오픈소스 코드를 타고 내부를 공격한다"는 일은 사실상 없습니다**
- 실제로 벌어지는 건 — **방화벽이 뚫리거나 API가 부정 이용돼 내부 GPU로 채굴**\
  → 그리고 이건 **방화벽으로 잘 막힙니다**
- 진짜 무서운 건 **공급망 공격으로 데이터가 나가는 것**\
  → 이건 방화벽의 **나가는 쪽**을 막아야 합니다

::: punch
들어오는 걸 막는 얘기는 많이 들으셨을 겁니다. \
오늘은 **나가는 쪽** 얘기를 하겠습니다.
:::

::: notes
**2-1 · 위협 2/2** · `CORE`
- 발표자 전력 한 줄: 「SW 공급망 공격 대응을 위한 SBOM 관리」 EOST 2024
- ☐ 행사명·날짜·자료 링크 확인 후 확정
- 공급망 공격은 **앱이 정상 동작하는 채로** 유출시키므로 코드 검토로 발견 불가 — 이게 핵심
- 패키지 하나에 의존성 수백 개. AI가 쓴 코드는 제작자 본인도 전부 설명 못 함
:::


## 하기 쉬운 실수, 그리고 안전하게 운영하는 법 {.fit}

| | | 하기 쉬운 실수 | 문제가 되는 것 | 안전하게 운영하는 법 |
|:-:|:-:|---|---|---|
| **방화벽**<br>In | [01]{.keycap} | 도커 올리고 **ufw로 막은 줄 안다** | 포트 열림 → 침입 → **GPU 채굴** | `ufw-docker` 또는 `DOCKER-USER` DROP |
| **방화벽**<br>Out | [02]{.keycap} | **들어오는 쪽만** 막고 나가는 쪽은 그대로 | **공급망 → 데이터 유출** | 호스트 `ufw default deny outgoing` · WAS·DB 는 compose `internal: true` |
| | [03]{.keycap} | *그럼 패키지는 어떻게 받나* | CDN 이라 허용목록이 사실상 **인터넷 열기** → **02 가 무력화** | **squid 한 대**로 허용목록을 내부 IP 하나로 · 진지하면 pull-through 캐시 |
| | [04]{.keycap} | 인증서 갱신 때문에 **다 열어둔다** | LE 검증 출발지를 못 좁혀 **80/443 전면 개방** | **DNS-01** — 인바운드가 아예 불필요 · `_acme-challenge` 만 위임 |
| **접근**<br>통제 | [05]{.keycap} | **로그인을 직접 만든다** | 자작 인증 취약점 | IdP + `forward_auth` — 앱은 로그인을 구현하지 않음 |
| | [06]{.keycap} | 앱이 늘수록 **계정이 흩어진다** | 퇴사자 계정 잔존, 권한 추적 불가 | **IdP 하나로 공통 관리** |
| | [07]{.keycap} | **앱이 그대로 노출된다** | 프레임워크 지문 · 버전 배너 · 스캔 | **mTLS** — 없으면 TLS 단계에서 끝<br>부담되면 → authentik **outpost** |
| **운영**<br>격리 | [08]{.keycap} | **서버를 손으로 고친다** | 재현 불가 · 복구 불가 | **Git이 정답** — compose 로 재생성 |
| | [09]{.keycap} | 로그가 **그 기계에만** 있다 | 침해되면 증거가 없다 | **다른 기계로** 전송 |
| | [10]{.keycap} | 하이퍼바이저를 안 만진다 | 게스트 침해 시 방어선 없음 | **Proxmox 방화벽 = VM 밖** |

> **앱은 무한히 늘어도 상자는 하나입니다**

::: notes
**2-2 · 중심** · `CORE`
- 번호 열 개가 뒤 **열한 장**과 1:1 이다(02 만 개요·코드 두 장). "01 부터 보겠습니다" 로 넘어갈 것
- 03 은 실수가 아니라 02 의 후속 질문이라 기울임으로 뒀음 — 읽을 때도 그렇게
- **이 한 장으로 5분을 썰로 풀어도 된다.** 행마다 겪은 얘기가 붙으니까
- 썰 모드면 다음 9장은 15초씩 후루룩 넘기며 확인용으로만 씀
- 강의 모드면 여기 1분, 다음 9장을 장당 1분씩
- 어느 모드든 **행 순서는 위협 순서**(채굴 → 유출 → 인증 → 운영). 순서 바꾸지 말 것
- 배포물 A4 뒷면이 이 표
:::


## [01]{.keycap} 도커를 올렸는데 ufw로 막은 줄 압니다 {.center}

::: {.callout .caution}
`ufw default deny incoming` 을 걸어 두고 막혔다고 생각합니다. \
**컨테이너에는 안 걸립니다** — Docker 가 iptables 를 직접 조작하고, \
컨테이너 트래픽은 `INPUT` 이 아니라 `FORWARD` 체인으로 갑니다
:::

::: {.callout .danger}
포트는 그대로 열려 있습니다 → 침입 → **내부 GPU 채굴**
:::

::: {.callout .done}
[`ufw-docker`](https://github.com/chaifeng/ufw-docker) · 또는 `iptables -I DOCKER-USER -j DROP` 뒤에 **필요한 것만 ACCEPT**
:::


::: punch
예외 목록이 **한 화면을 넘어가면** 그건 통제가 아니라 장식입니다
:::

::: notes
**2-3 · 상세 1/10** · `CORE`
- **여기서 틀을 가르친다.** 노랑(왜 안 통하나) → 빨강(그래서 뭐가 터지나)
  → 초록(정답) → 한 줄. 색인 표의 세 열과 같은 순서다.
  이 장에서 한 번 짚어 주면 02~10 은 설명 없이 읽힌다
- 오늘 가장 많이 사진 찍힐 장. 초록 상자 크게
- "ufw로 막았으니 됐다"고 넘어가는 사례가 정말 많음 — 실측 시연 있으면 최고
- ☐ ufw-docker 버전·한계 확인 후 권장
:::


## [02]{.keycap} 나가는 쪽은 아무도 안 막습니다 {.fit}

::: {.callout .caution}
들어오는 쪽만 막고 **나가는 쪽은 그대로** 둡니다. 그런데 공급망 유출은
빌드 시점이 아니라 **런타임 상시 연결**에서 일어납니다 → **공급망 → 데이터 유출**
:::

| 층 | 막히는 것 | 수단 |
|---|---|---|
| **호스트 프로세스** | 네이티브 앱의 아웃바운드 | `ufw default deny outgoing`<br>*웹 안 쓰는 노드(DB · 계산 · 워커)는 거의 공짜* |
| **바깥과 맞닿은 컨테이너** | 나가야 하니 **목적지만** 좁힘 | `DOCKER-USER` 체인 · 지정 프록시만 |
| **WAS · DB** | **아웃바운드 전면** | compose **`internal: true`** |

::: {.callout .warning}
**호스트의 `deny outgoing` 은 컨테이너에 안 걸립니다.** 컨테이너 트래픽은 `OUTPUT` 이
아니라 `FORWARD` 로 갑니다 — [01]{.keycap} **의 그 함정이고, 방향만 반대**입니다
:::

::: punch
제일 깊은 격리는 방화벽 규칙이 아니라 **compose 한 줄**입니다
:::

::: notes
**2-3 · 상세 2/11 (앞)** · `CORE` — 어디를 막는가
- **층마다 수단이 다르다는 게 전부다.** 하나로 안 된다
- ⚠ 상자를 꼭 짚을 것 — 「호스트에 걸었으니 컨테이너도 됐다」가 제일 흔한 오해다.
  **01 이 인바운드에서 당한 걸 02 는 아웃바운드에서 똑같이 당한다.** 방향만 반대
- **이건 실수가 아니라 「몰라서 안 하는 것」이다.** 톤을 바꿔 말할 것 —
  나머지는 「이렇게 하면 틀립니다」인데 이 장은 「이거 아세요?」다
- 호스트 줄이 **내 플랫폼 없이 오늘 바로 되는 것**이라
  「결국 자기 제품 팔려는 거 아니냐」를 여기서 한 번 끊어 준다
- **노드 성격을 보고 걸라**는 게 핵심이다. 블랭킷으로 권하면 사고 난다
  · 웹 안 쓰는 노드(DB·계산·내부 워커) — **거의 공짜로 이득.** 여기부터 하시라고 할 것
  · 인증서 갱신이 있는 노드 — **갱신 때만** 연다 → 04 의 DNS-01 과 같은 패턴
  · 외부 API 를 상시로 때리는 앱이 있는 노드 — 허용목록이 길어지니 03 의 프록시로 몰 것
- 실제로 열어 줄 것 (묻거든): `ufw allow out 53` · `ufw allow out 123`
  · `ufw allow out to <프록시> port 3128`
- ⚠ **공짜가 아니라는 건 말할 것** — 깜빡하면 apt·pip·외부 API 가 전부 죽고
  `docker pull` 도 막힌다. 그래서 03 이 바로 뒤에 온다
:::


## [02]{.keycap} 그 한 줄 — `internal: true` {.fit}

```yaml
networks:
  edge:   { driver: bridge }     # 바깥과 맞닿는 유일한 망
  app:    { internal: true }     # ← 이 한 줄이 아웃바운드를 끊습니다
  data:   { internal: true }

services:
  proxy:  { networks: [edge, app], ports: ["443:443"] }
  egress: { networks: [edge, app] }   # 유일한 출구 — 03 의 squid 한 대
  was:    { networks: [app, data] }   # edge 에 없음 → 나갈 길이 없음
  db:     { networks: [data] }        # 가장 깊은 자리
```

::: {.callout .warning}
**`edge` 에 같이 붙이는 순간 무효입니다.** 망 두 개에 붙으면 **나갈 수 있는 쪽으로** 나갑니다
:::

::: {.callout .done}
가끔은 나가야 합니다. 그때는 **타이머를 같이 겁니다** \
`systemd-run --on-active=15min --unit=net-close /usr/local/sbin/net-close`
:::

::: punch
수동 토글이 아니라, **만료되는 예외**입니다
:::

::: notes
**2-3 · 상세 2/11 (뒤)** · `CORE` — 그걸 어떻게 쓰는가
- **「iptables 를 안 써도 WAS·DB 는 나갈 수가 없다」가 이 장의 전부다.**
  게이트웨이 자체가 안 붙는다. 선언으로 끝나는 격리
- ⚠ 걸리는 데 셋 (물으면)
  · `internal` 망에서는 **외부 이름 해석이 안 된다.** `egress` 같은 **서비스 이름은
    되고**(도커 내장 DNS) `api.example.com` 은 안 된다. 의도된 동작 — 해석은 프록시가 한다
  · **`ports:` 를 internal 망 서비스에 못 쓴다.** 그래서 `proxy` 만 가진다
  · 망 두 개에 붙이면 끝. `was` 가 `[app, data]` 인 게 전부다
- 타이머 한 줄이 **5부 ⑤(긴급 조치에 만료일)의 코드판**이다.
  1부 「임시 조치에 만료일이 없었다」가 여기서 회수된다
- 유일한 실패 모드 = 다시 닫는 걸 잊는 것. 그래서 자동 재잠금이 핵심
- 전체 스크립트(net-open / net-close / net-watch)는 **배포물 A4 뒷면**에.
  ☐ `ufw delete allow out 80,443/tcp` 가 원 규칙과 매칭되는지 **드라이런 확인**
:::


## [03]{.keycap} 그럼 apt · pip · conda는 어떻게 하죠? {.center .fit}

::: {.callout .caution}
02 를 걸어도 **패키지는 받아야 합니다.** 그래서 허용목록을 엽니다 — 그런데
**PyPI·npm 은 CDN 이라 호스트가 계속 바뀝니다.** 도메인으로도 IP 로도 못 좁힙니다
:::

::: {.callout .danger}
허용목록이 사실상 **「인터넷 열기」**가 됩니다 — **02 가 무력화됩니다**
:::

::: {.callout .todo}
제대로 된 답은 **기관이 미러를 하나 운영**해 주는 것입니다.
그러면 팀마다 따로 세울 일이 없습니다. **우리는 없습니다**
:::

::: {.callout .done}
그래서 **squid 한 대.** 컨테이너는 squid 만 보고, 나갈 수 있는 건 squid 뿐 —
허용목록이 **내부 IP 하나**가 됩니다. 진지하게는 **pull-through 캐시**(Harbor · devpi/bandersnatch)
:::

::: punch
허용목록이 아니라 **단일 오리진**이 되고, 재현성·감사 로그가 덤입니다
:::

::: notes
**2-3 · 상세 3/10** · `CORE`
- ⚠ **축을 헷갈리지 말 것.** 이 장은 「나쁜 패키지가 들어오는 걸 막자」가 **아니다.**
  02 에서 세운 아웃바운드 차단이 **허용목록 때문에 무너지는** 이야기다.
  패키지 내용 검증은 여기서 다루지 않는다
- 핵심 한 줄 — CDN 이라 **좁힐 대상이 없다.** 04 의 LE 와 같은 모양의 문제다
  (출발지/목적지를 특정할 수 없어서 결국 다 연다)
- ☐ 상자: 미러를 **누가 운영하느냐**의 문제다. 팀마다 squid 를 세우는 게 정상은 아니다
  → **5부 ⑧ 공식 미러**에서 "아까 그 ☐" 로 회수할 것
- squid 를 자랑처럼 말하지 말 것 — **차선**이라는 걸 분명히 해야 5부가 산다
- 아웃바운드를 막으면 여기서 다들 막힘 — 그래서 질문을 제목으로
- 고정 태그·digest만 허용하는 정책과 세트
:::


## [04]{.keycap} 인증서 갱신 때문에 다 열어둡니다 {.center .fit}

::: {.callout .caution}
예전엔 **회계연도마다 한 번** 사서 갱신하면 끝이었습니다. 수명이
**200일 → 100일 → 47일**로 줄고 서비스까지 늘면 사람 손으로는 못 합니다 → Let's Encrypt.  
그런데 **HTTP-01 은 LE 가 어디서 검증하러 올지 모릅니다** — 출발지 IP 를 일부러 공개하지 않고,
**여러 지점에서 동시에** 확인합니다. **ACL 에 넣을 대상이 없습니다**
:::

::: {.callout .danger}
그래서 **80/443 을 전 세계에 열어 둡니다** — 공인 IP 에 ACL 로 좁혀 두려던 게 도로아미타불
:::

::: {.callout .done}
**DNS-01 은 인바운드가 아예 필요 없습니다.** TXT 레코드만 쓰면 되니 **ACL 을 그대로 둡니다**.  
와일드카드도 DNS-01 에서만 나옵니다. compose 안에서는 **caddy만** 아웃바운드 허용
:::

::: {.callout .notice}
대신 **DNS 쪽 부담**이 생깁니다 — 그런데 **`_acme-challenge` 만 위임**받으면 됩니다.
존 전체를 맡지도, 부서가 DNS 서버를 운영하지도 않습니다. 토큰 권한도 **그 레코드 하나**로 좁힙니다
:::

::: punch
**DNS-01 + 와일드카드** — 앱이 늘어도 발급 이벤트는 안 늘어납니다
:::

::: notes
**2-3 · 상세 4/10** · `CORE`
- **인과를 끝까지 말할 것.** 「수명이 짧아져서」가 아니라
  「LE 로 갈 수밖에 없는데 HTTP-01 은 출발지를 특정할 수 없어서」다.
  이 한 칸이 빠지면 "그냥 IP 목록 받아서 열면 되잖아" 가 바로 나온다
- Q&A 대비 근거: LE 는 검증 출발지 IP 를 **정책적으로 공개하지 않는다**
  (언제든 바뀔 수 있어서). 2020년부터 다지점 검증(MPIC)을 하고 있고
  CA/B Forum 이 의무화했다 — BGP 하이재킹 대응. 목록을 줄 수가 없는 구조다
- 수명 일정은 CA/B Forum SC-081 — 2026.3. 200일 / 2027.3. 100일 / 2029.3. 47일
- DNS-01 이 유일한 길인 이유 둘: 인바운드 불필요 · **와일드카드는 DNS-01 에서만**
- ⚠ 「DNS 키를 서버에 두라고?」는 **반드시 나온다.** 파란 상자로 선제로 받을 것 —
  `_acme-challenge` 만 CNAME 으로 위임받으면 존 전체를 안 맡는다. 실제로 해 보면
  운영할 만하다. 06 의 「부서가 운영할 서버가 없습니다」와 같은 기법이다
- 아주 구체적이고 바로 써먹는 장. 실무자 반응이 제일 좋을 자리
- DCV 재사용 10일 — 질문 나오면 답할 것
- "갱신 때문에 열어둔다"가 실제로 가장 흔한 구멍
:::

## [06]{.keycap} 앱이 늘수록 계정이 흩어집니다 {.fit}

::: {.callout .caution}
섀도우 IT 하는 사람은 **하나만 안 합니다.** 좋은 게 보이면 하나씩 더 붙입니다.  
바이브코딩으로 앱도 만들고요 — **앱이 늘 때마다 계정이 가장 큰 문제가 됩니다**
:::

::: {.callout .danger}
퇴사자 계정 잔존 · **권한 추적 불가**
:::

::: {.callout .done}
```
기관 IdP
   ↓  (등록 1건)
iam.부서.example.kr — authentik    (기관엔 SP, 앱엔 IdP)
   ↓
부서 앱 · 앱 · 앱 · 앱 …
```

- 기관 IAM 담당자 입장에서 등록 요청이 **100건 → 1건**
- 앱들은 기관 IdP 속성 전체를 못 받고 **브로커가 거른 것만** 받습니다
- DNS 는 `_acme-challenge` 만 위임받으면 **부서가 운영할 서버가 없습니다**
:::

::: punch
통제 완화가 아니라 **통제 대상 축소**입니다
:::

::: notes
**2-3 · 상세 6/10** · `CORE`
- 기관 IAM 담당자가 반대할 수 없는 프레임으로 말할 것
- 책임 경계도 같이 잘림 — "이 앱들의 인가는 부서 책임"이 등록 1건으로 표현됨
- 퇴사자 계정 정리가 한 곳에서 끝난다는 점을 실무자에게 강조
:::


## [07]{.keycap} 앱이 그대로 노출됩니다 — 노출 면 줄이기 {.fit}

::: {.callout .danger}
프레임워크 지문 · 버전 배너 · 스캔 — **앱이 그대로 보입니다**
:::

목적은 하나입니다. **앱을 세상에 안 보이게 하는 것.** 방법이 둘이고 강도가 다릅니다.

| | 막히는 지점 | 공격자가 알아내는 것 | 부담 |
|---|---|---|---|
| **mTLS** | **TLS 핸드셰이크** | 아무것도. HTTP 응답이 아예 없음 | 기기마다 인증서 설치·갱신 |
| authentik **outpost** | HTTP 요청 (`forward_auth`) | 프록시가 있다 · authentik 을 쓴다 | 없음 |

::: {.callout .done}
**mTLS 가 훨씬 강합니다** — 앱은커녕 프록시 응답도 못 봅니다.  
그런데 **인증서 까는 걸 다들 귀찮아해서** 현실에서는 outpost 를 쓰게 됩니다.  
`ez-mtls-manager` 는 **바로 그 부담을 줄이려고** 만들었습니다 — 자가발급 + 다중 IdP 인증 + 갱신 자동화 · <https://github.com/KREONET/ez-mtls-manager>
:::

::: punch
둘 중 뭘 쓰든, **앱 개발자는 아무것도 안 해도 됩니다**
:::

::: notes
**2-3 · 상세 7/10** · `CORE`
- 순서: 목적 → mTLS(강함) → 왜 안 쓰나(귀찮음) → 그래서 만든 도구 → 그래도 부담되면 outpost
- **자기 도구 홍보로 들리지 않게** — "이 문제를 겪어서 만들었다"까지만
- 1-2 넛지 회수 지점. 정답이 있어도 부담이 크면 안 쓴다 → 부담을 줄이는 게 일
- ☐ 라이선스 표준 표기 확인 후 공개 권할 것 (현재 NOASSERTION)
- ☐ **원격 접속 질문에 답이 없다.** 01~10 어디에도 「집에서 어떻게 붙나」가 없다.
  10번의 「SSH 는 관리 대역만」은 하이퍼바이저 관리용이지 연구자 작업 접속이 아니다.
  대학 랩 국룰이 Tailscale·SSH 터널이라 **반드시 나오는 질문**이다. 정리할 것 —
  (가) 3부 「입구」대로 **조직 IP 대역 고정** → 원격은 기관 VPN 으로만
  (나) **mTLS 인증서가 자격** → IP 와 무관, 집에서도 붙음 (그러면 사설 VPN 이 불필요)
  SADP 가 실제로 어느 쪽인지에 따라 답이 갈린다. **(나)면 이 장에 한 줄 넣을 값어치가 크다** —
  5부 「Tailscale → 사설 VPN → 승인 대상」에 대한 **기술적 답**이 되기 때문
- ☐ 연구자의 **서버 SSH 접속**은 발표 범위 밖으로 둘지 정할 것.
  주제가 「앱 프로토타입」이라 빼는 게 scope 상 맞지만, 질문은 온다
:::

## 해외는 어떤 노력을 하나요? — Trusted CI {.fit}

* 미국 **NSF 사이버보안 우수센터** <sup>NSF Cybersecurity Center of Excellence</sup> 수행
* 2012년부터 **14년째 진행중** <sup>NSF [1234408](https://www.nsf.gov/awardsearch/showAward?AWD_ID=1234408) · [1547272](https://www.nsf.gov/awardsearch/showAward?AWD_ID=1547272) · [1920430](https://www.nsf.gov/awardsearch/showAward?AWD_ID=1920430) · [2241313](https://www.nsf.gov/awardsearch/showAward?AWD_ID=2241313)</sup> (연 600만 달러 <sup>약 80억</sup> 규모)
* 연구 인프라 및 관련 오픈소스 프로젝트에 **1:1 로 붙어서** 보안을 강화

::: {.dense3}
| 대상 | | 무엇을 했나 |
|---|:-:|---|
| [**Jupyter**](https://blog.jupyter.org/posts/2021/trusted-ci-cybersecurity-engagement-with-jupyter/) | 2021 | 보안 문서가 **어디에 비었는지 전수 조사** + 배포 유형별(슈퍼컴센터 · 캠퍼스 클러스터) **모범사례 작성** |
| [**Tapis**](https://doi.org/10.5281/zenodo.10903502) | 2024 | 코드 수준 보안 점검 — **심각한 취약점 4건 + 버그 1건** 발견, 개발팀이 반영 |
| [**Gemini 천문대**](https://scholarworks.iu.edu/iuswrrest/api/core/bitstreams/7022683e-79f5-4bf5-936e-1f19169d675f/content)<br><sup>하와이</sup> | 2015–16 | 데이터 **무결성** 확보 보안 로드맵 + 우선순위 평가지표(**Water line**) 도입 · 사용자 보안 교육 |
| [**Array of Things**](https://scholarworks.iu.edu/iuswrrest/api/core/bitstreams/8d12805b-5452-429b-8cf2-602a197afef5/content)<br><sup>시카고</sup> | 2016 | 도시 **센서망**의 보안 · 개인정보 보호 정책 검토 + **대중 소통 · 투명성** 확보 지원 |
:::

::: notes
그리고 이거, 제가 지어낸 접근이 아니에요.

미국에 Trusted CI 라고 NSF 사이버보안 우수센터가 있어요.
2012년에 시작해서 14년째고요, 연 600만 달러니까 한 80억쯤 됩니다.
연구 인프라랑 오픈소스 프로젝트에 1:1 로 붙어서 같이 고쳐 줘요.

몇 개만 보시면요.
Jupyter 는 보안 문서가 어디에 비었는지 전수 조사하고,
배포 유형별로 — 슈퍼컴센터용, 캠퍼스 클러스터용 — 모범사례를 써 줬어요.
Tapis 는 코드를 들여다봐서 심각한 취약점 네 건이랑 버그 하나를 찾아냈고요.
천문대도 붙었어요. 하와이 제미니 천문대. 로드맵 세우고 교육까지 했습니다.
시카고 Array of Things 는 도시 센서망인데, 보안뿐 아니라
개인정보랑 대중 소통까지 같이 봤어요.

- **시설이 붙는다는 게 핵심이다.** 소프트웨어만 나열하면 「개발 얘기」로 들리는데
  **천문대 · 도시 센서망**이 붙으면 **우리 얘기**가 된다
- ⚠ **EPICS · RTEMS 가 화면에서 빠졌다**(2023. 1. 웨비나). 1부 **「고립이 면죄부입니다」**
  회수에 쓰던 카드다. 말로라도 한 번 넣을 것 —
  **「웨비나에는 EPICS 도 있습니다. 가속기 제어 시스템이요.
  아까 계측 게이트웨이 붙이면 소명서 매년 새로 쓴다고 했죠? 저쪽은 공개 세미나로 다룹니다」**
- ⚠ **TransPAC 도 화면에서 빠졌다** — 미국–아시아태평양 **연구망** 연결 사업이라
  이 방에서 남 얘기가 아니다. 둘 다 **출처 장에는 남아 있다**
- Array of Things 에서 **개인정보·대중 소통**까지 봤다는 대목을 흘리지 말 것 —
  보안을 「막는 일」이 아니라 **「같이 설명하는 일」**로 다룬 사례다
:::



## 무엇을 중요시 하나요? — Trusted CI {.fit}

::: {.callout .quote}
[**Framework**](https://doi.org/10.5281/zenodo.4562447) \
기존의 단편적 통제 지침에서 벗어나, \
조직 고유의 미션에 최적화된 방식으로 사이버 보안을 지속 가능하고 체계적으로 실행하도록 돕는 프레임워크
:::

::: {.callout .quote}
[**OSCRP**](https://trustedci.github.io/OSCRP/) — Open Science Cyber Risk Profile \
공격자나 수법이 아니라, **자원을 잃으면 무엇을 못 하게 되는가**로 기술한 문서

| Asset 자산 | Concern 무슨 일이 | Consequence 그래서 무엇을 잃나 |
|---|---|---|
| Documentation (wiki) | Inaccessible | Lost science time |
| Network-connected <br>sensor control system | **Inaccessible network**<br>(flooding attack) | Lost science time, <br>affecting unrelated projects at the same facility |
| Internal data | Data exposed | Reduced reputation · legal action |

**과학자들(working group)이 만들어 올렸습니다. 위에서 내려온 게 아닙니다** — 누구나 **GitHub 으로 문제를 제기**합니다

:::

**개방을 깨지 않는 보안**은 이미 하나의 분야입니다. **우리는 그 가이드가 없습니다**

::: notes
이 센터가 내놓은 게 둘 있는데, 이게 핵심이에요.

Framework 이라는 걸 내놨는데, 만든 이유를 이렇게 밝혀요.
「통제 항목에만 좁게 집중한 지침이 넘쳐나서」 만들었다.
무슨 말이냐면 — **시킬 거리는 많은데, 누가 정하고 돈은 어디서 나오는지는 아무도 안 쓴다**는 거에요.
그래서 기둥을 네 개로 뒀어요. 사명, 거버넌스, 자원, 그리고 통제.
통제는 그중 하나일 뿐이에요.

다른 하나가 OSCRP 인데, 이건 목적이 더 재밌어요.
「과학자와 IT 보안 담당자 사이의 소통 간극을 메우려고」 만들었대요.
방법이 재밌어요. 공격자가 누구냐 수법이 뭐냐를 안 봐요.
내 자산이 뭐고, 거기 무슨 일이 생기면, 내가 뭘 잃느냐로 적습니다.

첫 줄 보세요. 위키 문서에 못 들어가게 되면 연구 시간을 잃는다.
「못 들어감」도 위험으로 세는 거에요. 가용성을 기밀성이랑 같은 급으로 놓고요.
이 문서에서 제일 자주 나오는 결과가 「Lost science time」입니다.

둘째 줄도 보세요. 센서 제어 시스템이 끊기면
같은 시설의 상관없는 과제까지 영향을 받는다고 적혀 있어요.

원인이 공격이든 우리 손이든, 잃는 건 똑같이 연구 시간입니다.

그리고 이게 어떻게 만들어졌냐가 중요한데요.
working group 이 만들어서 올린 거에요. 위에서 내려온 게 아니고요.
지금도 GitHub 에 올려두고 「문제 있으면 이슈 남기세요」 합니다.
쓰는 사람들이 지침을 같이 고치는 거죠.

- **「시어머니만 많다」가 Framework 인용의 풀이다.** 5부 54 「시어머니 둘 —
  국정원·감사원」과 같은 말이라 거기서 메아리가 난다. 다만 그 단어는 5부에서 쓸 것
- ⚠⚠ **이 표가 1부 「감사의 비대칭」을 받쳐 준다. 다만 선을 정확히 지킬 것.**
  · **OSCRP 가 말하는 것** — 「못 쓰게 되는 것」은 피해다. `Lost science time` 이
    문서에서 **가장 많이 나오는 결과**(7회)고, `Availability(accessibility)` 가
    Integrity·Confidentiality 와 **동급**으로 들어가 있다
  · **OSCRP 가 말하지 않는 것** — 그 원인으로 **「보안 조치」를 적어두진 않았다.**
    사례는 전부 침입·랜섬웨어·자격증명 추측이다 (`impede`·`restrict` 용례 0건)
  · 그러니 **「OSCRP 가 금지도 피해라고 했다」고 말하면 안 된다.** 할 수 있는 말은 여기까지다 —
    **「못 쓰게 되는 걸 피해로 세는 기준은 이미 있습니다. 원인이 공격이든 우리 손이든,
    잃는 건 똑같이 연구 시간입니다」**
- 둘째 줄을 꼭 읽을 것 — **센서 제어 시스템이 끊기면 「같은 시설의 무관한 과제까지」**
  영향을 받는다고 적혀 있다. 1부 **「고립이 면죄부입니다」**와 바로 이어지고,
  「우리 과제만 손해지」가 아니라는 근거가 된다
- ⚠ **「아래서 만들어 올렸다」가 이 인용의 핵심이다.** 결과물 자랑이 아니라 **거버넌스** 얘기다.
  working group 이 쓰고, GitHub 이슈로 계속 고친다. 우리 지침은 **누가 썼는지도 모르고
  의견 낼 데도 없다.** 그 대비를 말로 한 번 짚을 것
- 그래서 **5부 ⑧ 이 「조직을 만들자」로 끝나면 안 된다** — 그 조직이 혼자 쓰는 게 아니라
  **working group 을 열고 이슈를 받는 방식**이어야 한다. ⑨(개편 전 고지)와도 같은 축
- Bloom 발표(2023. 1.)의 결론도 쓸 만하다 — 「커뮤니티에 *대한* 연구가 아니라
  커뮤니티와 *함께* 하는 연구여야 한다」
- arXiv 1904.05383 의 핵심 — 위에서 내리꽂는 규정이 아니라 **서비스 모델**이다.
  「그럼 누가 강제하냐」가 오면 이걸로 받을 것
- ⚠ 자랑처럼 들리지 않게 — **「제가 지어낸 게 아닙니다」가 이 장의 전부**다.
  바로 다음 장이 「먼저, 한계부터」라 톤이 맞는다
- **연 600만 달러 · 2029. 9. 는 Berkeley Lab 발표문 원문으로 확인했다** —
  *"a five-year, $6-million per-year award to run through September 2029.
  Lawrence Berkeley National Laboratory will now serve as Trusted CI's central steward."*
  출처 장에 그 페이지를 걸어 뒀다
- ☐ **그 발표문에도 award 번호는 없다.** 확인된 번호는 ACI-1234408 · ACI-1547272 ·
  OAC-1920430 · OAC-2241313 넷뿐이다. **묻거든 2024 건 번호는 말하지 말 것**
:::


## 우리는 어디까지 약속해야 할까요? {.fit}

| 과장된 약속 | 검증 가능한 약속 |
|---|---|
| 침입을 막습니다 | 공격자가 **목적지를 임의로 고를 수 없습니다** |
| 탈취물이 못 나갑니다 | 앱마다 데이터 접근권한을 좁힙니다 |
| 앱이 안전합니다 | 침해된 앱을 격리하고 복구할 수 있습니다 |
| 전부 **추적됩니다** | 접근 로그는 **항상** 남고 **다른 기계로** 보냅니다.<br>**OIDC 를 거친 경로**에는 거기에 **누가**까지 붙습니다<br><small>caddy log_append auth_sub {http.request.header.X-Auth-Request-User}</small> |

::: ref
[github.com/KREONET/caddy-xproxy](https://github.com/KREONET/caddy-xproxy) — `conf.d/00-log-auth.caddy` (MIT)
:::

::: notes
자, 그러면 저는 어떻게 재느냐.

왼쪽처럼 쓰면 안 돼요. 「침입을 막습니다」, 「앱이 안전합니다」.
이거 검증이 안 되잖아요? 안 뚫렸다는 걸 어떻게 증명해요.

오른쪽처럼 써야 해요.
「공격자가 목적지를 임의로 고를 수 없습니다」 — 이건 확인할 수 있어요.
「침해된 앱을 격리하고 복구할 수 있습니다」 — 이것도 해보면 되고요.

그리고 마지막 줄. 「전부 추적됩니다」도 과장이에요.

로그 자체는 항상 남습니다. 그리고 그 기계에만 두지 않고 밖으로 보내고요.
그건 기본이에요.

거기에 더해서, OIDC 를 거친 경로는 누가 했는지까지 붙습니다.
설정 한 줄이면 돼요. 인증 프록시가 넘겨준 사용자 아이디를 로그에 얹는 겁니다.
인증을 안 거치는 경로는 당연히 안 붙고요.

- ⚠⚠ **Q&A 카드 — 「나가는 건 완전히 막히나요?」** 화면에서는 뺐지만 반드시 나올 질문이다.
  **못 막는다.** 앱이 정상적으로 응답할 수 있으면 그 응답에 자료를 실어 보낼 수 있다.
  덜 만든 게 아니라 **원리적으로 안 된다** — 응답에서 정상 데이터와 유출을 가르려면
  앱이 뭘 하는 물건인지 알아야 하는데, 그게 **블랙박스 전제를 깨는 일**이다
  · 경로 넷 — ① 계정 얻어 요청 ② 침해된 앱이 정상 응답에 얹기
    ③ **사용자 브라우저를 밟고 나가기**(컨테이너 아웃바운드 차단이 무의미해진다)
    ④ 응답 시간·길이 같은 은닉 채널
  · 막지는 못해도 **공짜는 아니게 만든다** — 계정이 있어야 하고, 로그에 누가가 남고,
    권한이 좁고, 양이 튀면 잡힌다. **익명 대량에서 신원 붙는 소량으로** 바뀐다
  · 「DLP 붙이면 되잖아요」 → **완화는 됩니다. 다만 그 순간 앱 속을 알아야 하고,
    그러면 앱 수만큼 규칙이 늡니다. 그게 벗어나려던 상태입니다**
- ☐ **데이터 볼륨 복구는 아직이다**(Git 은 설정만 되돌림). 물으면 그대로 답할 것

- ⚠ **이 장은 Framework·OSCRP 와 같은 축이다.** 그래서 바로 뒤에 붙였다 —
  · Framework : 통제 목록 말고 **프로그램**으로 재라
  · OSCRP : 공격자·수법 말고 **자산과 피해 영향**으로 재라
  · 여기 : 「침입을 막습니다」 말고 **「탈출이 막혔다」**로 재라
  **셋이 같은 이야기다.** 「저쪽은 저렇게 잽니다. 그럼 저는 이렇게 재겠습니다」로 이을 것
- ⚠ **마지막 줄(「신원이 붙는 유출」)은 네 번째 행에서 나온다.** 앞 세 행은
  출구·권한·복구 얘기라 거기선 안 나온다. 전에는 그 행이 없어서 **펀치가 떠 있었다**
- ⚠ **두 가지를 섞지 말 것.** 로그를 남기고 **밖으로 보내는 것**은 전 구간 기본이다
  (2부 09 「로그가 그 기계에만 있습니다」의 답). 조건부인 건 **사용자 식별자**뿐이고,
  그건 **OIDC 를 거친 경로**에만 붙는다. 전에 「(필요한 경우) 로그에 남습니다」로
  적었다가 **로깅 자체가 선택처럼** 읽혀서 고쳤다
- 그래서 과장이 안 된다 — 「전부 추적됩니다」는 거짓이고,
  **「로그는 다 남는다 + 인증 거친 건 누가까지 남는다」**가 사실이다
- Q&A 카드 — 같은 파일에 `(log-internal) log_append auth internal-bypass` 가 있다.
  **내부 우회 경로는 식별자가 없는데 빈칸으로 두지 않고 「여긴 원래 없음」이라고 적어 둔다.**
  주석에도 「식별자가 없는 것이 정상임을 명시한다」고 써 있다.
  「로그에 구멍 있는 거 아니냐」가 오면 이걸로 받을 것 — **구멍이 있다는 사실이 기록된다**
- 「혼자 만들었다」는 뺐다 — **1부 17번에서 이미 했다**(제가 그 한 명입니다, 10년째).
  3부에서 또 하면 중복이고, 5부 ⑦ 존속 KPI 는 1부 쪽을 받으면 된다

**3부 · SADP 4/5** · `CORE`
- 유출하려면 조직 IP 대역 안에서 인증된 사용자로 들어와야 함 → 신원·시각이 로그에 남음
- 보안담당자 앞에서 과장하면 거기서 끝. 이 장이 신뢰를 만듦
:::

아까 열 개 보셨잖아요? 그걸 네 자리로 접으면 이렇게 돼요.
들어오는 쪽, 나가는 쪽, 받아오는 쪽, 그리고 기록.
가운데 열이 아까 그 번호들이에요.

- ☐ **해결됨** — 10(하이퍼바이저)이 표에 없던 건 빠뜨린 게 아니라 층이 다르기 때문이다.

## 쓰는 분이 알아야 할 건 한 문장입니다 {.fit}

::: {.callout .done}
### 「내부 Git 의 **앱 베이스를 클론해서** 만드세요」
:::

| | 앱 만드는 사람이 하는 일 |
|:-:|---|
| **1** | 목적에 맞는 **앱 베이스를 고른다** — 목록에서 |
| **2** | `git clone` |
| **3** | **자기 기능만** 만든다 — 로그인 · HTTPS · 접근제어는 **손대지 않는다** |
| **4** | `git push` → 자동 배포. `my_app.my_team.my_company.net` 에 뜬다 |
| **5** | 동료에게 **주소만** 보낸다. 로그인은 **기관 계정 그대로** |

::: punch
네 개 통제 지점은 **제가 압니다.** 쓰시는 분은 **고르고, 클론하고, 올리면** 됩니다
:::

::: notes
그럼 이걸 쓰는 분은 뭘 해야 하냐. 한 문장이면 됩니다.
「내부 Git 에 앱 베이스 있으니까 클론해서 만드세요」.

순서로 보면 이래요.
목록에서 목적에 맞는 베이스를 하나 고르고, 클론하고,
자기 기능만 만들어서 push 합니다.
로그인이나 HTTPS, 접근제어는 손도 안 댑니다. 이미 들어 있거든요.
push 하면 자동으로 배포돼서 주소가 뜨고요.
동료한테는 주소만 보내면 됩니다. 로그인은 기관 계정 그대로 쓰니까요.

통제 지점이 네 개니 뭐니 하는 건 쓰는 분이 알 필요가 없어요.

- ⚠ **앞 장(4개 통제 지점)이 복잡해 보인다는 걸 여기서 바로 풀 것.**
  「방금 그 네 개, 쓰시는 분은 몰라도 됩니다」로 받고 시작하면 깔끔하다
- ⚠ **3번이 이 장의 전부다** — 「자기 기능만」. 로그인·HTTPS·접근제어를
  **손대지 않는다**가 2부 열 개를 통째로 건너뛰는 지점이다
- ⚠ **「설정」이라는 말을 쓰지 말 것.** 쓰는 사람의 동사는 **고른다 · 클론한다 · 올린다** 셋뿐
- 5번도 흘리지 말 것 — **주소만 보낸다.** 계정을 따로 안 만드니
  2부 06(앱이 늘수록 계정이 흩어진다)이 여기서 사라진다
:::


## 관리자가 한 번 해두는 일 {.fit}

목적별로 **빈 앱 베이스**를 만들어 둡니다. 프리셋이 박힌 채로

| | 베이스에 박아 두는 것 | |
|---|---|:-:|
| **누가 보나** <sup>OIDC 그룹 범위</sup> | ① 우리 팀 · ② 전 직원 · ③ **ANY**(공개) | **3** |
| **어디서 보나** | ① 사무실 **팀 IP 대역** · ② 회사 IP · ③ **밖에서도 — OIDC 프록시 경유**<br><small>*③ 은 밖에서 열리되, 로그인 전까지는 앱 코드가 노출되지 않습니다*</small> | **3** |
| **무엇과 붙나** | ① 없음 · ② 내부 API 제공자 **A 와만** | **2** |
| | 경우의 수 | **18** |

**18 가지가 나오지만, 실제로 쓰는 건 서너 개입니다.** 그 서너 개만 베이스로 만들어 둡니다 \
실험 대시보드를 부서 안에서만 보려면 — **①①①**

::: punch
**앱마다 규칙을 만들면 앱 수만큼 늘지만, 베이스는 패턴 수만큼만 늡니다**
:::

::: notes
그럼 베이스는 누가 만드냐. 관리자가 한 번 해둡니다.

목적별로 빈 앱 베이스를 만들어 두는 거에요. 프리셋이 박힌 채로요.
누가 보나 — 우리 팀이냐, 전 직원이냐, 아무나 봐도 되냐.
어디서 보나 — 사무실 팀 아이피만이냐, 회사 안이냐, 밖에서도 되냐.
밖에서 여는 경우에도 로그인 전까지는 앱 코드가 아예 안 보입니다.
무엇과 붙나 — 아무것과도 안 붙냐, 내부 API 하나랑만 붙냐.

셋을 곱하면 열여덟 가지가 나와요.
그런데 실제로 쓰는 건 서너 개밖에 안 됩니다.
그 서너 개만 베이스로 만들어 두는 거에요. 열여덟 개를 다 열어두는 게 아니라.

예를 들어 실험 대시보드를 부서 안에서만 보고 싶다, 그러면 ①①① 입니다.
우리 팀만, 사무실 팀 아이피에서만, 아무것과도 안 붙게.
조합이 모자라면 베이스를 하나 더 만들면 돼요.

- ⚠ **「18 가지가 나오지만 실제로 쓰는 건 서너 개」가 이 장의 설계 논리다.**
  경우의 수를 다 열어 주면 그게 설정이 되고(=2부 회귀), 안 열어 주면 못 쓴다.
  **쓰는 패턴만 굳히는 것**이 그 사이의 답이다
- **원문자를 쓴 이유** — 프리셋이 **「①①①」처럼 주소가 된다.** 추상적인 「조합」이
  구체적인 기호가 되고, 베이스 이름으로도 쓸 수 있다. 입으로도 짧다
- **예시를 꼭 들 것** — 1부의 **실험 대시보드(라즈베리파이)**가 ①①① 이다.
  「부서 안에서만 보여줄 자리가 없다」던 그 요구가 **세 글자**가 된다
- **펀치가 이 장의 전부다.** 앱마다 규칙을 만들면 **앱 수만큼** 늘고,
  베이스로 만들면 **패턴 수만큼만** 는다. 3부 간지의
  「앱은 무한히 늘어도 상자는 하나」와 같은 말이다
- **「어디서 보나」의 셋째 칸이 1부의 빈칸을 채운다** — 밖에서도 열리되 로그인
  전까지는 코드도 안 보인다. 기관이 주는 자리가 「대외 공개용 아니면 없음」이던
  그 사이가 여기다. 시간 보고 한마디 얹을지 결정
- ⚠ **관리자 쪽 부담을 솔직히 말할 것** — 이 일은 공짜가 아니다. 다만 **한 번**이고,
  앱이 늘어도 안 는다. 2부가 「앱마다 매번」이었던 것과 대비된다
:::

못 쓰게만 하고 대체를 안 주면 밖으로 나갑니다. 당연하죠.
그래서 대응되는 게 있다는 걸 보여드릴게요.

노션 쓰시면 Outline, 슬랙 쓰시면 Mattermost,

이름 다 외우실 필요 없고요, 대응이 있다는 것만요.

그리고 마지막 줄이 중요해요.
내부 자료 쓰는 앱 — 바이브코딩으로 만드신 그거요.
이건 대체품이 없어요. 직접 만드신 거니까.
1부에서 「같이 활용하는 걸 못 만든다」고 했던 그 빈 칸이 이겁니다.

**3부 · SADP 3/5** · `CORE`
- 1부 「그래서 지금 우리가 만들 수 있는 것」의 **「사례 없음」** 칸을 여기서 회수한다.
  그 장을 안 깔았으면 이 표는 그냥 소프트웨어 목록으로 읽힌다
- **오른쪽 열이 전부다.** 왼쪽은 "여러분이 이미 쓰고 계신 것"이고
  오른쪽은 "팀 안에 띄울 수 있는 것". 이름을 다 읽지 말고 **대응이 있다는 것만**
- 마지막 줄(바이브코딩으로 만든 그것)에서 한 번 멈출 것 —
  **내부 자료를 쓰는 앱은 올릴 데가 아예 없다.** 2부·3부가 그 자리를 만드는 것
- ⚠ 특정 제품을 권하는 자리가 아니다. **대체가 있다**는 것까지만.
  "뭐가 제일 낫냐"가 오면 "기관 사정에 따라 다르다"로 받을 것
- 이어지는 할 말(5부로 넘김): 어쭙잖은 정보화 용역으로 **안 쓰는 걸 만들지 말고**,
  검증된 오픈소스를 팀이 띄울 수 있게 하는 쪽이 싸고 빠르다
:::

## 입사일 이전 메일이 검색되시나요?<br><small>가장 오래된 손잡이 — 메일링 리스트와 아카이브</small> {.fit}

::: punch
저는 2013년에 들어간 회사에서, 입사 전 우리 팀 메일이 전부 검색됐습니다
:::

- 팀 메일주소로 오간 것이면 **내가 오기 전 것도** 보입니다
- **다른 팀에 뭘 부탁하는 메일**에도 우리 팀 주소를 넣습니다. 선임자도 그렇게 했고요
- 그래서 신입도 알 수 있었습니다 — 저 팀엔 **누구를 통해, 어떤 순서로, 어떤 어투로** 요청하는지
- To 에 팀메일을 안 넣으면 혼났습니다. \
  이유는 보안이 아니라 *"나중에 다른 사람이 이 일을 못 이어받아서"*

::: punch
인수인계 문서는 결론을 알려주지만, 스레드는 **일하는 방식**을 알려줍니다
:::

::: {.callout .info}
사기업은 사람이 나가는 것을 전제로 기록을 설계합니다
:::

::: notes
**4-1 · 손잡이 3/7** · `CORE`
- **어투(tone) 얘기를 반드시 넣을 것.** 신입에게 제일 어려운 게 "이 부서엔 어떻게 말해야 하나"
- "사기업 대 공공" 우열 구도로 가지 말 것. 설계 전제가 달랐다는 얘기
- **다음 장과 한 쌍이다** — 이 장이 「있었을 때」, 다음이 「없을 때」.
  키커로 화면에도 표시해 뒀으니 넘길 때 "이번엔 없을 때입니다" 한마디
- 이건 위키로는 안 됨. **일부러 쓴 문서가 아니라 일하다 남은 것**이라 진짜임
- 손 들기 유도: "입사 전 팀 메일이 검색되시는 분?" — 그 정적이 이 장의 내용
:::


## 출연연에 와서 가장 놀란 것<br><small>스스로의 역사를 버립니다 <sup>역사: 미시사 微視史 Microhistory</sup></small> {.fit}

- **팀 주소는 있습니다.** 없는 건 그걸 **검색할 웹 아카이브**입니다 — 보내고 끝입니다
- 메일 시스템에서 팀을 고르면 **개인 주소로 치환되어 1:1로 N번** 나가기도 합니다
- **shared mailbox**(내 메일함을 남과 나눠 보는 것) 개념도 없습니다

::: {.callout .danger}
**그래서 공지메일을 못 지웁니다** \
아카이브가 있으면 *"나중에 찾으면 되지"* 하고 지웁니다. 없으니까 **각자의 받은편지함이 곧 아카이브**입니다
:::

::: {.callout .done}
**팀메일 + 웹 아카이브가 있으면 위키도 필요 없습니다** — 보내면 그게 기록이고, **정리할 사람도 필요 없습니다**
:::

::: punch
여러분 받은편지함이 **이 조직의 아카이브**입니다. 그게 문제입니다
:::

::: notes
팀 주소는 있어요. 없는 건 그걸 검색할 웹 아카이브입니다. 보내고 끝이에요.
메일 시스템에서 팀을 고르면 개인 주소로 바뀌어서 1:1 로 N 번 나가기도 하고요.
shared mailbox 개념도 없습니다.

그래서 무슨 일이 생기냐면, 공지메일을 못 지웁니다.
아카이브가 있으면 「나중에 찾으면 되지」 하고 지우는데, 없으니까요.
여러분 받은편지함이 이 조직의 아카이브입니다. 그게 문제고요.

- **미시사**(微視史, microhistory) 를 여기서 한 번 쓸 수 있다 —
  **거대 서사는 보도자료로 남지만, 미시사는 메일 스레드에만 있다.**
  누가 누구에게 어떤 순서로 부탁했는지는 보고서에 안 적힌다.
  1부에서 유즈넷 아카이브로 1994년을 복원한 게 **정확히 미시사**였다. 그 대비가 산다
  · **부제에 주석으로 달아 뒀으니** 「미시사라고 하는데요」로 자연스럽게 꺼낼 수 있다.
    문장 뒤에 붙여서 읽는 흐름은 안 막는다 — 보는 사람만 본다
  · ⚠ 다만 설명이 필요한 단어다. **시간 없으면 통째로 생략.**
    쓰더라도 한 문장으로 끝내고 「공지메일 못 지웁니다」로 바로 갈 것 —
    이 장의 힘은 학술어가 아니라 **방 안 전원이 자기 받은편지함을 떠올리는 데** 있다
- 부제 「스스로의 역사를 버립니다」 — **버린다**가 핵심이다. 사라지는 게 아니라
  안 만들기로 한 것이다. 1부 유네스코 장(보존하자고 지목하고 2년 뒤 소멸)과 호응
- **"팀 주소가 없다"고 말하지 말 것.** 있음. 없는 건 아카이브다
- 공지메일 못 지운다는 대목에서 한 번 멈출 것. 방 안 전원이 자기 받은편지함을 떠올림
- 500명분이 쌓이면 용량이 얼마냐는 얘기까지 가면 실무자들이 웃음
- 1-2 디지털 풍화와 같은 얘기 — 거긴 사본이 깨졌고 여긴 애초에 사본이 없음
- Deja News(1995)가 이미 "쓰는 곳 = 남는 곳"을 했다는 얘기를 여유되면 한 줄
:::

## 손잡이가 없으면 쌓을 수 없습니다 {.fit}

- 기존 시스템에 뭘 이어 붙이려면 **손잡이**가 있어야 합니다. 그 손잡이가 **주소**(permalink URI)입니다
- 주소가 없으면 가리킬 수 없고, 가리킬 수 없으면 **인용도 연결도 자동화도 안 됩니다**
- 그래서 매번 처음부터 다시 만듭니다. 쌓이지 않고 **붕괴합니다**

오늘 이 발표가 근거를 댈 수 있었던 건, 전부 **주소가 있었기 때문**입니다

| 근거 | 주소가 있어서 |
|---|---|
| 2001년 국가유산청 공지 | **25년 전 게시물인데 링크가 삽니다** |
| 서울시 결재문서 | 총량제 설명이 캡처 한 장으로 끝납니다 |
| 유즈넷 Message-ID | 본문이 89% 깨져도 **누가 언제 무엇에 답했는지**는 남았습니다 |

::: punch
반대로 연구소의 결재문서·회의록·팀 메일은, 이 발표에 근거로 넣을 수 없었습니다. 가리킬 주소가 없습니다.
:::

- AI로 앱 만드는 건 쉬워졌는데, **나누려니까** 배포·도메인·HTTPS·로그인·IP통제가 붙습니다

> **연구는 고이면 퇴화합니다**

## 그런데 제도는 이미 바뀌었습니다 {.center}

- **2026. 5. 1.** 「국가 사이버보안 기본지침」 시행 — 기존 **망분리 조항 공식 폐지**
- **N2SF** — 데이터를 등급으로 나눠 통제를 **차등 적용**

```
C  Classified  기밀   — 유출되면 국가안보·기관에 심각한 피해
S  Sensitive   민감   — 유출되면 업무·개인에게 피해
O  Open        공개   — 공개돼도 피해가 없거나, 어차피 공개될 것
```

::: punch
제가 지금 성토한 게 정확히 N2SF가 고치려는 것입니다
:::

::: notes
**5-0 · 분류 2/4** · `CORE`
- 착지 지점. 성토가 정부 정책 방향과 일치하는 순간, 불평이 아니라 이행 요구가 됨
- **약어를 반드시 화면에 띄울 것.** C냐 O냐를 말로만 하면 머리에 안 들어감
- 청중석 보안담당자의 방어 반응을 여기서 해제
- ☐ 지침 원문 조문 확보 필요 (현재 2차 보도)
:::


## 그런데 과분류는 여전히 공짜입니다

- 차등 적용하라는데 **판단 주체는 현장**입니다
- 그런데 현장에는 **판단 근거**도, 판단했다가 **보호받을 장치**도 없습니다
- O로 분류했다 사고 나면 **문책**, 전부 C로 찍으면 **아무 일도 없음**

> **합리적인 담당자의 최적 전략은 여전히 "전부 C"입니다**

**게다가 기준이 둘입니다** — 보안 기준은 **국정원**, 감사 기준은 **감사원 디지털감사국**.
2024년에 생긴 조직입니다. 현장은 둘 중 **더 엄한 쪽**에 맞춥니다. 그게 합리적이니까요.

::: punch
필요한 건 완화가 아니라 두 기준의 정합입니다
:::

::: notes
**5-0 · 분류 3/4** · `CORE`
- N2SF는 제도를 바꿨지만 **인센티브는 안 바꿨다** — 1-2 "금지가 공짜"의 25년 뒤 반복형
- 담당자 개인을 탓하지 않는다는 걸 반복해서 명시
- "완화해달라"가 아니라 "엇갈리지 않게 해달라" — 반박 불가 프레임
- **5부 ⑥(분류자 보호)의 근거가 여기다**
- 「시어머니가 둘인데 **둘째는 2024년에 생겼다**」는 게 요점 — 과분류 압력이
  완화된 게 아니라 **최근에 더 세졌다.** N2SF 가 제도를 푸는 동안 감사 쪽은 조여졌다
- ⚠ **과(課) 번호를 대지 말 것.** 디지털감사국 산하 4개 과인 것까지는 확인되는데
  번호로 부르는지 기능명(정보시스템운영과 등)인지는 확인 안 됐다. **국까지만**
- 근거: 2024. 1. 감사원 조직개편 — 공직감찰본부에 디지털감사국 신설,

## 비어 있는 다섯 층 {.fit}

1. **분류 판정 기준표** — 천체 관측 데이터는? 투고 전 원고는? 실험실 리눅스는? *예시 시나리오 30개면 됩니다*
2. **분류자 보호 조항** — 절차대로 근거 남기고 분류했으면 결과에 면책 *← 없으면 아무도 O를 못 씁니다*
3. **등급별 최소 통제 참조 구현** — 문장이 아니라 실제 설정으로
4. **질의 답변 공개 누적** — 판례집이 쌓여야 매번 처음부터 안 합니다
5. **재분류·이의 절차**

> **현장 담당자는 이 문장을 어떻게 실행합니까?**

## ① 총량제 집계 단위를 바꿔주십시오 {.fit}

- **현행** — 호스트명(서브도메인) 수로 집계
- **문제** — 서브도메인 분리는 **브라우저의 보안 경계**입니다. 서브URI로 묶으면 origin을 공유해 쿠키·세션이 섞이고, 한 앱의 XSS가 나머지를 가져갑니다
- **제안 ㉠** — **독립적으로 운영·패치·폐기되는 관리 주체 수**로
- **제안 ㉡** — 폐지 도메인은 반납이 아니라 **경로를 보존하는 301 + 유효한 인증서** 유지 의무로
- **소관** — 행정안전부 가이드 개정 *(법 개정 아님)*

::: {.callout .danger}
**3부에서 보신 그 플랫폼은 앱마다 서브도메인을 발급합니다.** \
총량제 밑에서는 — **안전하게 만들수록 총량을 먹습니다**
:::

> **지금 지표는 안전한 구조에 벌점을 줍니다**

**이미 벌어진 일입니다** — 2020년 9월 질병관리본부(`cdc.go.kr`)가 질병관리청(`kdca.go.kr`)으로 승격했습니다. 코로나19 한복판이었습니다.

```
2026. 9. 17. 실측 — https://www.cdc.go.kr/kdca/5468/subview.do

  ①  SSL 인증서에 cdc.go.kr 이름이 없음  →  브라우저가 먼저 경고로 막습니다
  ②  경고를 넘기면  302 Found → https://www.kdca.go.kr
                                    ↑ 루트로만. 경로는 버려집니다
```

::: punch
리다이렉트를 "했다"고 보고할 수 있습니다. 그런데 링크는 여전히 죽어 있습니다.
:::

::: notes
**5-1 · 정책 1/11** · `CORE`
- **「제가 만든 게 바로 그 벌점을 받습니다」가 이 장을 자기 얘기로 만든다.**
  3부에서 앱마다 서브도메인을 발급한다고 해 뒀고, 그게 총량제와 정면으로 부딪친다.
  남 얘기로 지표를 비판하면 불평이고, **자기 것이 걸리면 증거**다
- **㉡이 이 장의 새 무기.** ㉠은 논쟁이 되지만 ㉡은 반박이 거의 불가능하고 비용도 0에 가까움
- **"리다이렉트가 없다"고 말하지 말 것.** 있음(302). 문제는 경로를 버리는 것과 인증서
- **"미국은 1913년부터 같은 주소"라고 말하지 말 것.** 그때 인터넷 없음 — 안 바뀐 건 *부처 이름*
- 발표 당일 재확인: `curl -skI -L https://www.cdc.go.kr/kdca/5468/subview.do | grep -iE '^HTTP/|^location:'`
- 출처: IT동아 김대은 「질병관리청은 왜 '죽은 링크'를 관리하지 않을까」 2021. 4. 27.
- 4부 손잡이 회수 — "제도가 손잡이를 반납하라고 합니다"
:::


## ② 정적 호스팅은 별도 등급으로

- 서버 사이드 로직 없음 · DB 없음 · 사용자 입력 없음 · **전부 공개 예정 정보**
- 침해 시 피해는 **콘텐츠 변조**. **유출할 데이터가 존재하지 않습니다**
- 그런데 현행은 동적 웹 서비스와 **동일한 절차**를 요구합니다

::: punch
털릴 게 없는 것을 지키느라 털릴 게 있는 것을 못 보고 있습니다
:::

**①** 변조 위험은 남습니다(기관 도메인 정적 페이지 = 피싱 랜딩). 대응은 Git 자동 복구.
**②** 폼 하나·외부 API 하나 붙으면 등급이 달라집니다. **정적 판정 기준**을 함께 제안해야 합니다.

## ⑧ 국가 오픈소스 인프라 전담 조직과 공식 미러 {.fit}

- 모델은 **대만 NCHC 자유소프트웨어실험실** — 미러를 운영하는 팀이 도구를 만듭니다
- 둘은 **같은 역량**입니다. 그리고 **인원 없이는 남의 것을 가져다 쓰는 것조차 안 됩니다**
- 슈퍼컴과 연구망을 **동시에 가진 기관**은 국내에 하나뿐입니다
- 내놓을 것은 미러만이 아닙니다 — **레퍼런스 · 교육 · 핵심 부품 점검**입니다.
  Trusted CI 가 Framework · OSCRP · 1:1 협력을 내놓듯이
- **소관** — 부처 직제·예산 *(지침 개정으로는 안 되는 유일한 항목)*

::: {.callout .notice}
**유출을 막는 건 맞습니다.** 기술 유출은 민감하고, 외부 메일이 되는 곳은 이미
그만큼 **보안 범위가 정해진** 겁니다. \
문제는 **연속성과 협업**입니다 — 안 해주면 **바깥 것을 찾습니다.**
필요한 건 완화가 아니라 **안전하게 구축하고 쓰는 법에 대한 교육과 레퍼런스**입니다
:::

> **가져다 쓰는 것도 사람이 있어야 합니다**

::: notes
- **제안 개수는 그대로 아홉이다.** 교육·레퍼런스를 ⑩으로 세우지 않고 ⑧ 안에 넣었다 —
  전담 조직이 내놓을 산출물이지 별개 요구가 아니고, 「아홉 중 여섯」이 배포물까지 걸려 있다
- ⚠ **먼저 인정하고 들어갈 것** — 「유출 막는 건 맞다」를 말하지 않으면
  이 제안이 **규제 완화 요구**로 들린다. 기술 유출은 실제로 민감하고,
  외부 메일이 되는 곳은 그만큼 보안 범위가 이미 정해진 것이다
- 그 위에서 할 말은 하나다 — **연속성과 협업은 누가 해 주느냐.**
  안 해주면 바깥 것을 찾는다. 3부 Trusted CI 의 「우리는 그 가이드가 없습니다」가 여기로 온다

**5-1 · 정책 9/11** · `CORE`
- 성토가 아니라 직무 제안으로 끝내는 장
- "우리가 하겠습니다"까지 말할지는 현장 분위기 보고 판단 — 되돌릴 수 없음
- ⑦(존속 KPI)와 세트. 조직이 있어도 KPI가 없으면 또 사라짐 — ftp.kreonet.re.kr이 증거
:::


## ⑧ 그럼 이 부품들은 누가 봅니까 {.fit}

참조구현을 **퍼뜨리는 순간**, 그 부품이 **모든 기관의 급소**가 됩니다

| 부품 | 터지면 |
|---|---|
| **Caddy** <sup>리버스 프록시 · TLS</sup> | **입구**가 통째로 |
| **oauth2-proxy · authentik** <sup>OIDC</sup> | **인증**이 통째로 |
| **BIND9** <sup>DNS-01 챌린지</sup> | **인증서 발급**이 통째로 |
| **squid** <sup>허용목록 프록시</sup> | **빌드 경로**가 통째로 |
| **Docker · containerd · RKE2** | **격리**가 통째로 |

::: {.callout .caution}
부품 하나에 취약점 소식이 나면 **그 위에 선 전부가 흔들립니다.** \
이 참조구현은 **Caddy** 로 짰습니다 — 그럼 **Caddy 가 안 터져야** 합니다.
**DNS-01** 을 쓰기로 했으면 **BIND9 도 안전하게 관리돼야** 합니다
:::

::: punch
**Trusted CI 가 Jupyter · Singularity · Tapis 에 한 일이 정확히 이겁니다**
:::

::: notes
그리고 이거 하나 더요. 좀 뜨끔한 얘긴데.

제가 참조구현을 퍼뜨리자고 말씀드리고 있잖아요?
그런데 퍼뜨리는 순간, 그 부품들이 모든 기관의 급소가 됩니다.

이 참조구현 Caddy 로 짰거든요. 그럼 Caddy 가 안 터져야 해요.
DNS-01 챌린지 쓰기로 했으면 BIND9 도 안전하게 관리돼야 하고요.
인증은 oauth2-proxy, 빌드 경로는 squid, 바닥은 도커랑 RKE2.
이 중에 하나만 터져도 그 위에 선 게 전부 흔들립니다.

그래서 핵심 부품은 검증된 데서 봐 줘야 합니다.
아까 Trusted CI 가 Jupyter 랑 Singularity, Tapis 에 한 일이 정확히 이거에요.

- **이 장은 자기 제안의 위험을 스스로 짚는 자리다.** 표준화는 비용을 줄이는 대신
  **위험을 한 점에 모은다.** 그걸 먼저 말해야 ⑧ 전체가 믿긴다
- ⚠ **「nginx 가 취약점이 많다」고 말하지 말 것.** 특정 프로젝트를 깎는 주장이라
  바로 반박당하고, 논지와도 무관하다. 축은 **「무엇을 쓰든 그 부품에 의존하게 된다」**다
- **3부 Trusted CI 표가 여기서 회수된다** — 거기서 「저쪽은 이런 걸 한다」로 깔아 뒀고,
  여기서 「그게 우리한테 필요한 일이다」가 된다. 펀치를 그렇게 읽을 것
- **⑧ 과 같은 번호다.** 제안은 아홉 그대로 — 전담 조직이 할 일의 목록이 늘어난 것이지
  새 요구가 아니다. 미러 · 레퍼런스 · 교육 · **핵심 부품 점검** 넷이 된다
- Q&A — 「상용 제품 쓰면 되지 않나」가 오면: 상용도 부품에 의존하고,
  **그 부품이 뭔지 우리가 못 본다**는 차이가 있다. 오픈소스는 적어도 볼 수 있다
:::
