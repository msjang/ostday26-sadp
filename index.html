<script>
window.DECK = {

  // 슬라이드 비율 '16:9' | '16:10' | '4:3' | 'full'
  //   full = 로드 시점의 창 크기를 슬라이드 크기로 잡습니다(레터박스 없음).
  //          창을 줄이면 비율을 유지하며 축소됩니다.
  //   PDF 쪽 크기도 이 값을 따라갑니다.
  ratio:   '16:9',

  // 슬라이드 크기 그대로의 흰 종이를 회색 바탕 위에 띄운다.
  // 여백·넘침을 눈으로 보려는 디버깅용 — 기본 꺼짐.
  paper:   false,

  // 세로 정렬 'top' | 'center'   ('center' 가 reveal 기본값)
  //   슬라이드별로 뒤집기: <section class="center"> / <section class="top">
  valign:  'top',

  // 가로 정렬 'left' | 'center' | 'right'   ('center' 가 reveal 기본값)
  //   어디서든 뒤집기 — 제목 중괄호 `## 제목 {.tcenter}` · 열 `{.column .tright}`
  //   · 덩어리 `::: {.tright}`. 양끝맞춤은 .tjustify
  halign:  'left',

  // 어떤 제목 레벨이 슬라이드를 가르는가
  //   sectionLevel = 간지(부 표지) · slideLevel = 일반 슬라이드
  //   더 깊은 제목(###…)은 슬라이드 안의 소제목으로 남습니다.
  //   문서가 ## 부터 시작하는 구조면 2/3 으로 한 단계씩 내리면 됩니다.
  sectionLevel: 1,
  slideLevel:   2,

  // 그림 캡션에 "그림 1." 번호를 붙일지. 라벨은 deck.css 의 --fig-label
  figureNumber: false,

  chapnav: true,   // 상단 챕터 내비 (클릭하면 해당 간지로 이동)
  footer:  true,   // 하단 행사·연사·일자·쪽번호
  timer:   40,     // 좌하단 남은시간 타이머(분). 0 이면 안 그립니다
                   //   클릭=시작·정지 · 오른쪽클릭=처음으로 · 단축키 T / Shift+T

  meta: {
    title:   'AI 시대, 빠르고 안전한 앱 프로토타입',
    event:   '출연연 오픈소스 테크데이 2026',
    date:    '2026. 10. 7.',
    speaker: '장민석 (msjang@kisti.re.kr)',
  },
};

// CSS 가 읽을 수 있게 <html> 에 클래스로 찍는다 (렌더 전이라 깜빡임 없음)
document.documentElement.className = [
  DECK.paper ? 'paper' : '',
  'v-' + DECK.valign,
  'h-' + DECK.halign,
  DECK.figureNumber ? 'fignum' : '',
  DECK.chapnav ? '' : 'no-chapnav',
  DECK.footer  ? '' : 'no-footer',
].filter(Boolean).join(' ');
</script>

## 섀도우 IT <sup>Shadow IT</sup> 가 뭐냐면

::: {.callout .info}
**부서의 승인, 인지 또는 감독 없이\
엔터프라이즈 네트워크에서 사용되는 모든 소프트웨어·하드웨어**
:::

- **PoC <sup>개념검증, 사전검증</sup> 는 성격상 섀도우에 가깝습니다.**<br/>승인 전에 만들어봐야 승인 여부를 정할 수 있으니까요
- 즉 섀도우 IT는 예외가 아니라, **모든 새 시스템이 거쳐가는 단계**입니다

::: {.callout .warn}
그러면 질문이 바뀝니다\
— "막을 것인가"가 아니라 **"어떻게 양지로 올릴 것인가"**
:::

::: notes
일단 섀도우 IT는, 부서의 승인이나 인지 없이 회사 안에서 사용되는
모든 소프트웨어와 하드웨어를 의미합니다.
그런데 개념검증, PoC는 성격상 섀도우에 가깝습니다.
일단 해봐야지 승인 여부를 알 수가 있으니까요.

그런즉 섀도우 IT는 모든 시스템이 거쳐가는 단계입니다.
그러면 우리는 이렇게 물어야 됩니다.
섀도우 IT를 막을 게 아니라, 어떻게 양지로 끌어올릴까에 집중해야 된다는 겁니다.
:::

## 더 이른 학술정보 공유 이야기 - 유즈넷 <sup>Usenet</sup> {.center}

- 1981년 시작된 뉴스 서비스 <sup>웹(WWW)보다 10년 먼저 시작</sup>
- `han.comp.lang.c` <sup>한국어.컴퓨터.언어.C</sup> 처럼 계층적으로 이름을 붙인 그룹에 게시
- 사용자가 가까운 위치의 뉴스서버에 게시하면\
  피어 서버를 통해 전세계 모든 뉴스서버가 동기화 되며 뉴스가 전달되는 구조
- 메일링 리스트와 영향을 주고 받으며, 웹 포럼 <sup>BBS · 레딧 · Discourse</sup> 으로 이어진 계보

::: punch
중앙 서버도, 운영 회사도, 가입 심사도 없는 **탈중앙화 구조**
:::


::: notes
더 이른 정보 공유 이야기를 해보겠습니다.
유즈넷이 있습니다. 1981년에, 웹보다 10년 먼저 시작된 그런 서비스입니다.
지금의 메일링 리스트나 웹 포럼에 많은 영향을 주었고요.
:::


## 미국에서 쓴 글이 한국에 오는 길 <sup>(1994년 — 국경을 넘는 글은 전부 이 길로)</sup>{.fit}

![1994년 유즈넷 국내 유입 경로 — 서상용(2001) 36쪽에 기록된 실제 구성](images/diagram-usenet-1994-notitle.svg)

::: ref
[서상용, 「세계 수준의 연구전산망 뉴스 및 FTP서버 구축 관리」, 『지식정보인프라』 통권 4호, KISTI, 2001. 1. 15., 36쪽](https://koreascience.kr/article/JAKO200145940670892.pub)\

:::

::: notes
그러면 이 유즈넷을 이용해서 어떻게 정보가 전파되었느냐.
미국의 NASA나 UC 버클리에서 뉴스 게시물을 올립니다.

국내에 카이스트나 포스텍 같은 유수 대학에 정보가 전달되었습니다.

실은 P2P로 돼 있어서 하이어라키가 있는 건 아니고,
전 세계 모든 뉴스서버가 동기화되는 그런 구조였습니다.
:::


## 국가과학기술연구망 <sup>KREONET</sup> 이란 {.center .skip}

::: {.card}
::: {.card-body}
*  **국내 과학기술연구 진흥을 위한 네트워크**
* 한국과학기술정보연구원 <sup>KISTI</sup> 이 운영
* 1988 국내 최초 전국 단위 TCP/IP 기반 인터넷 서비스 시작 <sup>상용 보다 먼저</sup>
* 2026년 서울-대전 1.2Tbps 백본으로 국내외 200여 산·학·연 기관 연동, \
  국제 400Gbps 백본으로 해외 연구망과 연동
:::
:::

::: ref
KREONET 국가과학기술연구망 — [www.kreonet.net](https://www.kreonet.net)\
NREN, National Research and Education Network — [en.wikipedia.org](https://en.wikipedia.org/wiki/National_research_and_education_network)
:::

::: notes
크레오넷이 뭐냐면, 저희 KISTI가 운영하는 국가과학기술연구망입니다.
1988년에 국내 최초로 전국 단위 TCP/IP 인터넷 서비스를 시작했어요. 상용보다 먼저였고요.
지금은 서울-대전 1.2테라 백본으로 국내외 200여 기관을 연동합니다.

## 이분들 본업이 뭐였냐면 {.fit}

::: {.callout .info}
| 인물 | 연구소 | 본업 |
|---|---|---|
| **전밀반** | 포항공대 가속기연구소 | **입자 가속기** 연구 |
| **서상용** | 한국자원연구소 석유해저자원연구부 | **석유·해저자원** 연구 |
:::

- 전산이 전공이 아닙니다. 뉴스서버 운영은 **누구의 KPI에도 없었습니다**
- 팀 버너스리 <sup>웹(WWW)의 창시자</sup> 도 같습니다 — **승인된 프로젝트가 아니었습니다.** \
  1989년 제안서에 그룹장이 적어 준 말은 **"Vague, but exciting"** 한 줄이었습니다

::: punch
자기가 불편해서 만든 겁니다. 본업이 아니어서 만들 수 있었던 거고요.  
아까 그 정의, 그대로입니다. [승인도 인지도 감독도 없었습니다.]{.badge .primary}
:::

::: ref
[서상용, 「세계 수준의 연구전산망 뉴스 및 FTP서버 구축 관리」, 『지식정보인프라』 통권 4호, KISTI, 2001. 1. 15., 36-37쪽](https://koreascience.kr/article/JAKO200145940670892.pub)\
Tim Berners-Lee, 「Information Management: A Proposal」, CERN, 1989. 3. — [w3.org/History/1989/proposal.html](https://www.w3.org/History/1989/proposal.html) · 그룹장 Mike Sendall 의 「Vague, but exciting」 메모
:::

::: notes
근데 이분들의 본업이 뭐냐고 하면, 전산 전공이 아닙니다.
전밀반 선생님은 입자 가속 연구를 하셨고요,
서상용 선생님은 석유나 해저자원 탐사가 주 연구 분야였습니다.
그리고 이 뉴스서버를 운영하라는 게 그 누구의 KPI에도 등록되지 않았습니다.

웹도 팀 버너스리가 주창을 했는데 승인된 프로젝트가 아니었습니다.
"애매모호한 개념이지만 흥미롭군", 이게 그룹장이 적어준 말의 전부였습니다.

즉 섀도우 IT는 자기가 불편해서 만든 겁니다.
실무자가 불편해서 만들고, 본업이 아니어도 만들 수 있고,
그래서 승인도 인지도 감독도 없이 만들어진 서비스입니다.
:::

## 필요했던 건 금지가 아니라 넛지 <sup>Nudge</sup> 였습니다 {.fit}

- 공유 폴더는 **일하라고 쓰던 것**입니다 — 읽기 전용은 여럿이 참고하려고,\
  쓰기는 *"주간업무보고 올리세요"* 를 **각자 공용 파일을 직접 고치는 방식**으로.\
  90년대 협업툴 없이 협업하던 방법입니다
- 많이 쓴다는 건 **그만큼 필요하다는 신호**입니다. \
  신호를 봤으면 할 일은 하나 — **같은 일을 더 싸고 더 안전하게 하는 방법** <sup>적정기술</sup> 을 찾는 것

읽기 전용을 기본값으로 · 쓰기가 필요한 폴더는 **하나만** 따로

그런데 실제로 나온 선택지는 둘뿐이었습니다 — 공유를 끈다 / 제대로 한다
:::


::: notes
그래서 말씀드릴 거는, 필요했던 건 금지가 아닙니다.
섀도우 IT 하지 말자가 아니라 넛지였습니다.

공유 폴더는 일하려고 만든 겁니다.
그리고 많이 쓴다는 건 그만큼 필요하다는 신호입니다.
그 신호를 봤으면, 같은 일을 더 싸고 안전하게 하는 방법을 찾는 게 필요한 일이었습니다.

지금 바이러스 때문에 문제가 생겼다고 했잖아요.
그러면 평시 기본값을, 쓰기 허용이 아니라 읽기 전용으로만 바꾸어라.
이렇게만 해도 공유 폴더의 상당 부분 기능은 작동했습니다.
:::

카이스트 FTP 다 아시죠?

근데 크레오넷 FTP는 2010년도에 사망을 했고요.
카이스트 FTP는 90년대 후반에 사라졌습니다.
그러다가 2002년에 학부생 개인이 사비로 하드웨어를 사서 다시 복원을 시킵니다.

그리고 지금까지 이어졌는데, 슬픈 소식은
카이스트 FTP를 운영하겠다는 후임자가 나타나지 않는 상태입니다.
후임자가 잘 안 구해져요. 이게 인프라성 일이다 보니까.
요즘 다 AI, AI 하잖아요. 학부생들 관심이 다 AI로 가고,
FTP 서버를 운영하겠다는 사람은 나타나지 않고 있는 그런 상태입니다.

여튼 말씀드릴 건, 이 차이가 금지가 아니라 할 사람이 없다는 겁니다.
사명감 있는 사람이 끝까지 한 명이라도 있으면 이 서비스는 운영이 됩니다.

그런데 이 사명감 가진 사람을 지치게 만들고 학을 떼게 만들고,
문서를 내놔라, 보안 패치를 해라, 이런 식으로 괴롭히면 그 서비스는 사라지게 됩니다.
물론 필요한 수준이 있어요. 필요한 수준이 있는데 너무 과도하게 요구하면,
나 안 그래도 사명감으로 일하고 있는 건데, 돈 받고 일하는 것도 아닌데,
내가 이 짓을 왜 해, 하면서 서비스를 접게 됩니다.
그렇게 2010년에 크레오넷 FTP가 사라지게 된 겁니다.
:::


## 팀 단위로 필요한 섀도우 IT {.fit}

외부 서비스인지 직접 설치인지는 **구분하지 않겠습니다. 필요한 기능만 적겠습니다**

| 기능 | 무엇을 하려고 |
|---|---|
| **위키** | 회의록 · 업무정보 · 인수인계 기록 |
| **메신저** | 업무 연락 — 폰에서 바로 받아야 함 |
| **캘린더** | 폰으로 동료 **휴가 · 출장 현황** 파악 |
| **모니터링** | **실험장비 구동현황** 파악 |
| **공동 논문작성** | **외부자 포함** 실시간 동기화 + 코멘트 |
| **코드 · 데이터** | 분석코드와 데이터를 같이 두고 **재현** |
| **분석 환경** | 환경을 **내 맘대로 바꿀 수 있는** GPU |
| **AI 도구** | 코드 · 문서 작업 보조 |

::: {.callout .question}
**이 중에 기관이 주는 게 몇 개입니까?** \
없거나 · 느리거나 · 내 맘대로 못 하거나 · **행정절차가 많거나**  
일하는 사람에게는 **전부 같은 뜻**입니다 — 지금은 못 씁니다
:::

::: punch
일을 하려면 필요한데요?
:::

::: notes
팀 단위로 섀도우 IT가 뭐가 필요한지 말씀을 드려보겠습니다.

일단 위키 필요합니다. 공공기관 사람들은 잘 모르는데,
회의록이나 업무 정보를 자그마한 단위로 기록합니다. 노션 비슷한 거예요.

메신저도 필요합니다. 업무 연락, 보통 카카오톡으로 하시죠.
기관 메신저 있습니다. 좋습니다.
그런데 우리가 보드 만들고 알람 시스템 만들잖아요.
외부에서는 슬랙이나 텔레그램에 AI 봇이나 모니터링 보드를 붙여요.
근데 우리 기관 메신저에, 우리가 만든 시스템 알람을 붙일 수가 있나요? 못 붙이잖아요.

캘린더 필요합니다. 부서 포털에 부서원 출장 내역 다 보이긴 해요.
근데 그거 확인하려면 VPN 켜고 포털 들어가서 팀원 캘린더를 봐야 됩니다.
누가 이렇게 불편한 걸 쓰겠어요. 안 쓰죠.

모니터링. 수억 원짜리 장비를 굴리고 있어요.
실험이 잘 진행되다가 파라미터가 이상하면 도중에 뻑이 나요.
그러면 언제 어디서든 지켜보고 싶어 해요. 밤에도, 추석에도 굴러갔으면 좋겠고요.
리모트에서 한두 시간마다 확인할 수 있어야 되는데, 못 하잖아요.
VPN 있고, 정보화 사업 해야 되고. 과학 연구를 하는 속도 자체가 떨어지는 겁니다.

논문 공동으로 작성하잖아요. 외부인 넣고요. 오버리프 아시죠.
코드나 데이터도 똑같이, 재현하기 위한 프레임워크들이 있으면 이게 섀도우가 되기 쉽고요.
AI 도구, 기관에서 제공을 해주긴 하는데 구려요.
구려서 사비를 들여서 쓰는 사람들이 상당히 많습니다.

기관이 주는 게 없거나, 느리거나, 내 마음대로 못 하거나,
아니면 거쳐야 되는 행정 절차가 많으면, 그냥 하지 말라는 뜻이에요.
근데 일을 하려면 필요하거든요.
:::


## 고립이 면죄부입니다 {.fit}

실험장비에서 데이터를 빼내려면 옆에 **ADC · 라즈베리파이**를 붙입니다. 그 순간 —

| | 보안성 검토 |
|---|---|
| 제조사 완제품, **네트워크 미연결** | **대상 아님** — 기납품이라 변경 불가<br>*그 안에서 20년 된 WinXP 가 돌고 있어도* |
| 거기에 **계측 게이트웨이**를 붙임 | **비인가 외부 장치 → 풀스캔**<br>기준이 매년 바뀌어 **작년 소명서를 못 씁니다** |
| 그 게이트웨이를 **검사하려면** | 스캐너 · 에이전트가 **x86 서버용**입니다 |

::: {.callout .warning}
계측 게이트웨이는 **ARM · RISC-V** 입니다. \
검사를 돌리겠다고 라이브러리를 욱여넣으면 — **임베디드의 장점인 최소 공격면을 스스로 버립니다**
:::

::: ref
[2026-06-24, 장민석, 연구자가 메타데이터를 입력하지 않게 하고 싶습니다. ESR(Electronic Science Record) 생태계 제언](https://www.facebook.com/ShuggieJang/posts/pfbid0ptQUfu93pyVLVeo3xkDpsorXUx3GfdEoLhxeqFuHSid1WRv8DRsjsQ6Vy7vtHNDfl) \
[2026-06-24, 장민석, 연구데이터는 왜 흐르지 않는가 — 그리고 그 해법(ESR)은 어떻게 망할 수 있는가](https://www.facebook.com/ShuggieJang/posts/pfbid0K7gf9X2RNrvnCmFwGa7bGmgSmVQaYbFnrVoXR6vNh88KSrxystXG3B1ThtarauBrl)
:::

::: punch
데이터를 흐르게 하려는 행위가 검토를 부르고, 검토를 통과하려는 행위가 공격면을 늘립니다
:::

::: notes
그리고 또 고립이 면죄부인 경우가 있습니다.

20억짜리, 30억짜리 그런 실험 장비가 있어요.
그런데 이게 고장이 안 나고 잘 돼요.
근데 처음에 샀을 때 윈도우 XP였어요. 근데 잘 돌아가요.

이제 데이터의 시대가 와서, 얘 데이터를 밖으로 빼내거나
리모트로 좀 제어를 해주는, 그게 있었으면 좋겠어요.
그러면 RS-232 시리얼 통신 올려서 적정 기술로 해결을 할 수가 있거든요.
실험 장비를 제어하는 게이트웨이를 라즈베리파이로, 100달러 이내로 되게 싸게 만들 수가 있습니다.

근데 이거를 하는 순간요.
네트워크에 미인가 장비가 연결되었기 때문에 보안성 검토의 대상이 됩니다.

데이터를 흐르게 하려는 행위가 검토를 부릅니다.
그리고 검토를 통과하려는 행위가 되려 공격면을 늘리는, 그런 경우가 있습니다.
:::


## 그리고 AI는 이미 OS 와 웹브라우저 안에 들어왔습니다 {.fit}

- [**Microsoft Recall**](https://support.microsoft.com/ko-kr/windows/ai/ai-features/retrace-your-steps-with-recall) — 화면을 주기적으로 찍어두고 AI가 검색·요약해줍니다
- 스마트폰에 대고 말하면 **LLM 이 앱을 직접 제어**합니다 — 일정 추가, 알람 설정, 메시지 발송
- **브라우저에도 들어왔습니다** — 크롬 **Gemini**, 엣지 **Copilot**.
  지금 열어 둔 **그 페이지를** 읽고 요약합니다
- 앱 하나를 막는 게 아니라 **운영체제와 브라우저에 들어와 있습니다**

- 금지하면 안 쓰는 게 아니라, **더 편한 바깥 것**을 씁니다
- 기관이 통제할 수 있는 건 줄고, 섀도우 IT는 **늘어납니다**

::: {.callout}
금지의 대상이 앱에서 **OS 와 브라우저**로 옮겨왔습니다. 그 요구사항 목록은 앞으로 더 길어집니다.
:::

::: punch
이걸 금지하실 겁니까?
:::

::: notes
그리고 AI는 이미 OS와 웹브라우저 안에 들어왔습니다.

마이크로소프트 리콜이라고 해서, 주기적으로 내 컴퓨터 화면을 스크린샷으로 찍어요.
그다음에 내가 어제 몇 시쯤에 뭘 하고 있었지, 라고 물어보면
걔가 대답하는 AI가 마이크로소프트에 이미 있습니다. 2024년에 나왔고요.

핸드폰으로 클로드나 코덱스한테 건강에 대한 걸 물어보잖아요.
건강을 위한 습관 형성을 하고 싶은데 어떻게 하면 좋겠니, 라고 물어보면
저 대신 알람을 달더라고요.
LLM 앱이 내 핸드폰을 제어를 이미 하는 시대가 그렇게 왔습니다.

브라우저에도 이제 들어왔어요. 엣지랑 크롬이랑.
우리 모두가 AI의 맛을 알잖아요.
크롬 익스텐션으로 웹브라우저 조작하는 거, 이미 알잖아요.
너도 나도 하려고 해요. 바깥에는 편한 게 늘어납니다.

근데 금지하면 안 쓰는 게 아니라,
기관이 감지할 수 없는 바깥 서비스를 더 쓸 뿐입니다.
게다가 요즘 이거 떼어내기가 쉽지 않아요.
:::


## 막으려면 기준이 있습니다 — SCIF <sup>Sensitive Compartmented Information Facility</sup> {.fit}

:::::: columns

::: column
극단적으로 막는 방법

* 연구소 입출입 **소지품 엑스레이 검사** - 수첩까지 걸러내기
* 제한구역 접근시 **폰/노트북 사물함**에 보관
* **전파가 안 닿는 구역**에서 업무수행
:::

::: column
**ICD 705** 미국 정보기관 민감정보 취급 시설 기준 

| 요건 | 내용 |
|---|---|
| **개인 전자기기** | **반입 금지** — 정부 승인·차폐된 것만 예외 |
| **전파 차폐** | **≥ 40 dB**, 10 kHz ~ 10 GHz |
| **전자파 방출** | **TEMPEST** 대책 — 지정 기관(CTTA) 평가 |
| **건축** | 신축 때 반영. **사후 적용은 비용이 훨씬 큽니다** |
:::

::::::

::: {.callout .notice}
국내에도 **보호구역 3단계**가 있습니다 — 제한지역 · 제한구역 · **통제구역**(비인가자 출입 금지).  
다만 **전자기기 반입 통제는 그 규정에 없습니다.** 기관 시행세칙 사항입니다
:::

::: {.callout .question}
**남의 나라 얘기가 아닙니다. 저도 겪었습니다** — 10년 전 어느 국가 연구기관 면접.  
폰은 경비실에 맡기고, **금속탐지기로 몸을 스캔**하고, 소지품 검사를 받고 들어갔습니다. **방문객에게도** 그렇게 합니다
:::

::: punch
수첩 한 권과 폰 한 대가 들어오는 환경이면, **통제 수준은 이미 정해진 겁니다**
:::

::: ref
[ICD/ICS 705 Technical Specification](https://exwc.navfac.navy.mil/Portals/88/Documents/EXWC/DoD_Locks/PDFs/ICD-ICS-705_Tech_Spec.pdf) · PED 반입 금지 · RF 차폐 ≥40 dB (10 kHz~10 GHz) · TEMPEST\
[보안업무규정 제60조 — 보호구역](https://www.law.go.kr/LSW/lsSideInfoP.do?lsiSeq=245095&lsId=&joNo=0060&joBrNo=00&docCls=jo&chrClsCd=010202&urlMode=lsScJoRltInfoR)
:::

::: notes
이거 금지, 제 생각엔 절대 못 합니다.
막으려고 하면 극단적으로 막을 수 있는 방법이 있기는 해요.
미 정보기관 민감정보 취급 기준으로 시설을 지으면 되거든요.

들어갈 때 엑스레이로 소지품 검사해요. 몸 전체 스캔해요.
그리고 개인 노트북, 폰, 전자기기는 전부 사물함에 넣고 들어갑니다.
그리고 전파가 닿지 않는 곳에서 업무를 수행합니다.
기지국 주변에 안 짓는 거예요. 전파 재머 설치하고,
전자파 차폐 실드 하고, 유리창에도 특수 필름 바르면 되거든요.

그리고 이런 식으로 일을 하는 곳이 있어요. 방산이요.
그래서 부모님이 돌아가셨다는 말을 전하기 위해서,
전해주려는 사람도 똑같이 핸드폰 놔두고 들어가서,
모든 방을 돌면서 그 사람을 찾아서 데리고 나와서 전화하라, 이런 데가 있어요.
우리나라에도 있거든요.

그런데 연구소에서 이렇게까지 하는 경우는 없거든요.
수첩 하나랑 전화기가 들어오는 환경은,
그걸로 정보가 유출될 수 있다는 걸 가정하고 시스템을 짜야 되는 거예요.
이 통제 수준이 이미 정해진 겁니다.
:::


## 가장 강하게 나눈 곳에서도 {.fit}

**망분리** 기관이 있습니다 — 내부망과 외부망을 아예 따로 둡니다

| | 내부망 | 외부망 |
|---|---|---|
| **데이터** | 반출 금지 대상 | 공개 가능한 **시뮬레이터 · 형상** |
| **연구** | 소 안에서만 | **노트북 반출 · 웹메일 가능** |
| **합치는 길** | ← **망간접점 시스템으로 밀어넣기** | |

::: {.callout .notice}
노트북이 나가고 웹메일이 되는 건 통제가 느슨해서가 아닙니다. \
**외부망 기준**이라 그렇습니다. — 밖에 있는 건 **이미 밖에 있어도 된다고 분류를 통과한 것**입니다
:::

::: {.callout .warning}
**그런데 개인 단말은 여기서도 들어옵니다.** \
망분리가 막는 건 `내부망 연결`이지 `반입`이 아닙니다. 내부망에서 작업하면서 **개인 폰으로 전화 받습니다**
:::

::: {.callout .question}
**그리고 연구는 칼로 두부 자르듯 나뉘지 않습니다.** \
아르키메데스는 목욕탕에서 풀었습니다. **요즘 연구자는** 사비를 들여 GPU 데탑을 집에 마련하고, \
**Claude Code 을 원격으로 걸어두고, 화장실에서도 피드백을 받습니다.** 그리고 그 결과를 들고 월요일에 들어옵니다
:::

::: punch
밖에서 하는 건 일탈이 아니라 **연구 연속성**입니다.
막은 건 **데이터지 머리가 아닙니다**
:::

::: notes
그리고 우리나라에서 몇몇 연구소는 망분리가 되어 있어요.
근데 망분리가 되어 있어도 어떻게 일하냐면,
망분리된 PC 앞에 앉아서 과기부 사무관의 전화를 받습니다.
터미널은 망분리가 돼 있는데, 전화기는 들어와서 외부랑 통화를 합니다.

어린이집에서 아이가 열났어요, 데려가세요, 라는 전화는 받을 수 있어야 되잖아요.
그 정도도 못 하나요?
그렇게 하려면, 연구소 안에서만 쓸 수 있는 핸드폰을 개인별로 지급하고,
밖에서 오는 연락은 안내 데스크에서 받아서 안에서 전해주면 됩니다.
그런 식으로 운영 안 하거든요. 돈이 많이 들어서 안 합니다.

그리고 연구는 칼로 두부 자르는 것처럼 딱 나뉘지가 않아요.
아르키메데스도 계속 곰곰이 생각하다가 목욕탕에서 유레카를 외쳤어요.
요즘 연구자들도 유레카가 어디서 터질지 몰라요.
그래서 항상 연구 환경과 동기화되는 환경을 갖추고
24시간 연구를 하는 사람들이 많습니다.

사비로 GPU를 사요. 자기 돈으로 천만 원짜리, 이천만 원짜리 GPU를 사시는 연구원들이 있어요.
데스크탑에 마련해서 그 안에서 굴러갈 수 있는 연구를 합니다.
당연히 공개된 코드에 공개된 환경으로 연구를 해요.
그렇게 검증이 된 아이디어를 밖에서 안으로 갖고 들어옵니다.
파라미터나 개념 같은 것들을 갖고 들어와서,
안에서 내부망에 있는 클러스터로 또 한 번 다시 돌려요.
그런 식으로 연구를 한단 말이에요.

이게 개인 연구원의 일탈로 볼 건가요? 아니죠.
연구의 연속성과 연구의 품질을 높이기 위해서 하는 행위예요.
그래서 데이터는 막을 수 있어요. 하지만 사람의 머리는 막지 못합니다.
:::

## 진짜 위험이 뭔지부터 — 지형이 바뀌었습니다 {.fit}

| | 예전 인식 | 지금 실제 |
|---|---|---|
| **랜섬웨어** | 제일 무섭다 | **공격은 기록적으로 늘었는데 돈이 안 됩니다**<br> — 지불액 2024년 **35% 감소, $813M**. 피해자가 안 냅니다 |
| **개인정보 유출** | 최우선 | 돈이 잘 안 됩니다 (다크웹 민번 1건당 10원 꼴) |
| **채굴** | 잘 모름 | **자원만 있으면 즉시 현금.** 협상도 피해자도 필요 없습니다 |
| **공급망** | 잘 모름 | **연구소에서 제일 위험.** 앱이 정상 동작하는 채로 데이터가 나갑니다 |

::: {.callout .notice}
랜섬웨어는 돈이 안 되기 시작했고, 채굴은 바로 돈이 됩니다
:::

::: notes
진짜 요즘 위험이 뭔지 알려드리겠습니다. 지형이 좀 바뀌었는데요.

랜섬웨어 위험하다고 많이들 말씀하시잖아요. 공격은 늘었거든요.
공격은 늘었는데, 랜섬웨어 감염시키고 나서
"야 비트코인으로 10억 줘, 그러면 우리가 풀어줄게" 이렇게 하잖아요.
근데 사람들이 돈을 지급을 안 합니다.
돈을 줘도 어차피 절반만 풀어주고 그러잖아요.
해커가 자기 신분 드러내고 하는 것도 아닌데 해커 말을 어떻게 믿어요.
돈을 안 줘요. 돈이 벌리는 장사가 아닙니다.

개인정보 유출이요. 우리나라 개인정보 유출 많죠.
그런데 주민등록번호 하나에 10원도 안 해요. 너무 싸졌어요.

그래서 어디로 넘어갔냐. 채굴로 넘어갑니다.
저도 지난 한 10년 동안 회사에 있으면서 이런저런 침해 사건을 좀 다뤄봤는데,
제일 많은 게 코인 채굴이에요.
취약점 통해서 어떤 함수를 실행할 수 있다, 그러면 채굴 애플리케이션을 깔아서 돌려요.
내부 코드 오염된 거 하나 없고요. 그냥 그 경로만 뚫린 거예요.
그리고 그 경로만 패치 치면 됩니다.
:::


## 그래서 연구소에서 무서운 건 둘입니다 {.key}

- **"오픈소스 코드를 타고 내부를 공격한다"는 일은 사실상 없습니다**
- 실제로 벌어지는 건 — **방화벽이 뚫리거나 API가 부정 이용돼 내부 GPU로 채굴**\
  → 그리고 이건 **방화벽으로 잘 막힙니다**
- 진짜 무서운 건 **공급망 공격으로 데이터가 나가는 것**\
  → 이건 방화벽의 **나가는 쪽**을 막아야 합니다

::: punch
들어오는 걸 막는 얘기는 많이 들으셨을 겁니다. \
오늘은 **나가는 쪽** 얘기를 하겠습니다.
:::

::: notes
얘는 왜 그러냐면, 해시 파워만 있으면 바로 코인을 벌 수 있단 말이에요.
즉시 현금화가 돼요.
그러면 이걸 하지, 누가 개인정보 탈취해서 그거 팔면서 장사를 해요.

제가 2년 전에 여기서 발표해드린 게 공급망 공격이었는데,
연구소에서 보면 위험한 건 둘인 것 같아요.

하나는 방화벽 뚫려서, 또는 API가 부정 사용돼서 GPU로 채굴이 될 수 있겠다.
이건 방화벽으로 잘 막힙니다.
또 하나는 오픈소스에 악성 코드 넣어서 안으로 갖고 들어온다.
공급망 공격 위험 심하다 심하다 얘기하는데,
사실 이게 들어오기까지도 되게 힘들고,
들어와서 공격이 실제로 일어나게 하는 것도 되게 힘들거든요.

그러면 진짜 무서운 게 뭐냐.
국가 연구소에서 무서운 건 정보가 탈취됐다는 겁니다.

솔직히 오픈소스는 리스크를 감당하고 쓰는 거예요.
갖다 쓰다가 버그가 있어요.
"너 왜 이런 버그를 만들었어, 너가 책임져" 이렇게 안 해요.
무료로 갖다 썼잖아요. 갖다 쓴 사람이 책임을 지는 거지, 만든 사람 책임이 아니에요.
버그는 일부러 만든 게 아니거든요.

그러면 어디에 집중해야 되냐.
그런 애플리케이션을 썼더라도 정보가 나가지 않게 시스템을 설계해야 되는 거예요.
그래서 오늘은 나가는 걸 막는 방법에 대해서 얘기를 드려볼게요.
:::


## 하기 쉬운 실수, 그리고 안전하게 운영하는 법 {.fit .key}

| | | 하기 쉬운 실수 | 문제가 되는 것 | 안전하게 운영하는 법 |
|:-:|:-:|---|---|---|
| **방화벽**<br>In | [01]{.keycap} | 도커 올리고 **ufw로 막은 줄 안다** | 포트 열림 → 침입 → **GPU 채굴** | `ufw-docker` 또는 `DOCKER-USER` DROP |
| **방화벽**<br>Out | [02]{.keycap} | **들어오는 쪽만** 막고 나가는 쪽은 그대로 | **공급망 → 데이터 유출** | 호스트 `ufw default deny outgoing` · WAS·DB 는 compose `internal: true` |
| | [03]{.keycap} | *그럼 패키지는 어떻게 받나* | CDN 이라 허용목록이 사실상 **인터넷 열기** → **02 가 무력화** | **squid 한 대**로 허용목록을 내부 IP 하나로 · 진지하면 pull-through 캐시 |
| | [04]{.keycap} | 인증서 갱신 때문에 **다 열어둔다** | LE 검증 출발지를 못 좁혀 **80/443 전면 개방** | **DNS-01** — 인바운드가 아예 불필요 · `_acme-challenge` 만 위임 |
| **접근**<br>통제 | [05]{.keycap} | **로그인을 직접 만든다** | 자작 인증 취약점 | IdP + `forward_auth` — 앱은 로그인을 구현하지 않음 |
| | [06]{.keycap} | 앱이 늘수록 **계정이 흩어진다** | 퇴사자 계정 잔존, 권한 추적 불가 | **IdP 하나로 공통 관리** |
| | [07]{.keycap} | **앱이 그대로 노출된다** | 프레임워크 지문 · 버전 배너 · 스캔 | **mTLS** — 없으면 TLS 단계에서 끝<br>부담되면 → authentik **outpost** |
| **운영**<br>격리 | [08]{.keycap} | **서버를 손으로 고친다** | 재현 불가 · 복구 불가 | **Git이 정답** — compose 로 재생성 |
| | [09]{.keycap} | 로그가 **그 기계에만** 있다 | 침해되면 증거가 없다 | **다른 기계로** 전송 |
| | [10]{.keycap} | 하이퍼바이저를 안 만진다 | 게스트 침해 시 방어선 없음 | **Proxmox 방화벽 = VM 밖** |

::: punch
**앱은 무한히 늘어도 상자는 하나입니다**
:::

::: notes
사람들이 하기 쉬운 실수가 있어요.
그리고 안전하게 운영하려고 하면, 제가 생각하기에는 한 열 가지 정도가 있습니다.
하나씩 말씀을 드릴게요.

크게 말씀드리면, 인바운드를 잘 막는다. 이건 많이 들어보셨을 거예요.
아웃바운드를 막는다는 거는 아마 말씀 안 들어보셨을 테니까,
그쪽 위주로 좀 설명을 드려볼게요.
:::


## [01]{.keycap} 도커를 올렸는데 ufw로 막은 줄 압니다 {.center}

::: {.callout .caution}
`ufw default deny incoming` 을 걸어 두고 막혔다고 생각합니다. \
**컨테이너에는 안 걸립니다** — Docker 가 iptables 를 직접 조작하고, \
컨테이너 트래픽은 `INPUT` 이 아니라 `FORWARD` 체인으로 갑니다
:::

::: {.callout .danger}
포트는 그대로 열려 있습니다 → 침입 → **내부 GPU 채굴**
:::

::: {.callout .done}
[`ufw-docker`](https://github.com/chaifeng/ufw-docker) · 또는 \
`iptables -I DOCKER-USER -j DROP` 뒤에 **필요한 것만 ACCEPT**
:::


::: punch
예외 목록이 **한 화면을 넘어가면** 그건 통제가 아니라 장식입니다
:::

::: notes
일단 첫 번째는 도커하고 ufw입니다.
리눅스에 ufw나 firewalld가 있어요.
근데 도커나 컨테이너를 깔면, 컨테이너의 네트워크를 구성하는 게
시스템 방화벽보다 우선으로 올라가게 됩니다.
컨테이너 쪽 네트워크 설정이 좀 복잡해요.

그래서 "나는 ufw 잘 걸었는데 뚫렸어요" 하면 보통 이겁니다.
막는 방법은 되게 간단해요.
ufw-docker를 쓰거나, DOCKER-USER 체인에 DROP 걸고 필요한 것만 ACCEPT 하면 됩니다.

근데 여기서 규칙이 많아진다, 그러면 그건 좀 아닌 것 같아요.
예외 목록이 한 화면을 넘어가면 그건 통제가 아니라 장식입니다.
:::


## [02]{.keycap} 나가는 쪽은 아무도 안 막습니다 {.fit}

::: {.callout .caution}
들어오는 쪽만 막고 **나가는 쪽은 그대로** 둡니다. \
그런데 공급망 유출은 빌드 시점이 아니라 **런타임 상시 연결**에서 일어납니다 → **공급망 → 데이터 유출**
:::

| 층 | 막히는 것 | 수단 |
|---|---|---|
| **호스트 프로세스** | 네이티브 앱의 아웃바운드 | `ufw default deny outgoing`<br>*웹 안 쓰는 노드(DB · 계산 · 워커)는 거의 공짜* |
| **바깥과 맞닿은 컨테이너** | 나가야 하니 **목적지만** 좁힘 | `DOCKER-USER` 체인 · 지정 프록시만 |
| **WAS · DB** | **아웃바운드 전면** | compose **`internal: true`** |

::: {.callout .warning}
**호스트의 `deny outgoing` 은 컨테이너에 안 걸립니다.** 컨테이너 트래픽은 `OUTPUT` 이
아니라 `FORWARD` 로 갑니다 — [01]{.keycap} **의 그 함정이고, 방향만 반대**입니다
:::

::: punch
제일 깊은 격리는 방화벽 규칙이 아니라 **compose 한 줄**입니다
:::

::: notes
나가는 쪽을 막는 경우는 생각보다 많이 없을 거예요.

나가는 쪽이 왜 중요하냐면,
apt나 dnf나 도커로 이미지를 당겨온다, 당겨오는 거니까 안으로 들어오는 것 같잖아요.
근데 TCP라는 게, 나 데이터 받았어, 데이터 줘, 그러면 데이터 주잖아요.
줄 때마다 이 부분이 손상이 일어났는지 안 일어났는지
그 여부를 다시 서버한테 보내게 돼 있어요.
즉 그게 나가요. "나는 데이터 잘 받았어"라는 걸 보내야
다음 데이터를 주는 식으로 동작하거든요.

그래서 패키지를 받으려고 하면 밖을 열어놔요. allow outgoing이에요.
그런데 패키지를 당기는 건 상시 일어나는 게 아니거든요.
그래서 패키지 업데이트만 하고 나서 deny outgoing 하게 되면, 밖으로 나가는 게 없어요.
정보를 탈취하는 코드가 들어와도 나갈 수가 없는 거예요.

근데 이거를 적용하는 경우를 많이 보지는 못했어요. 권장하는 것도 많이 보지 못했고요.

한 가지 주의하실 건, 호스트에 건 deny outgoing은 컨테이너에 안 걸립니다.
01에서 말씀드린 그 함정인데, 방향만 반대예요.
:::


## [02]{.keycap} 그 한 줄 — `internal: true` {.fit}

```yaml
networks:
  edge:   { driver: bridge }     # 바깥과 맞닿는 유일한 망
  app:    { internal: true }     # ← 이 한 줄이 아웃바운드를 끊습니다
  data:   { internal: true }

services:
  proxy:  { networks: [edge, app], ports: ["443:443"] }
  was:    { networks: [app, data] }   # edge 에 없음 → 나갈 길이 없음
  db:     { networks: [data] }        # 가장 깊은 자리
```

::: {.callout .warning}
**`edge` 에 같이 붙이는 순간 무효입니다.** 망 두 개에 붙으면 **나갈 수 있는 쪽으로** 나갑니다
:::

::: {.callout .done}
가끔은 나가야 합니다. 그때는 **타이머를 같이 겁니다** \
`systemd-run --on-active=15min --unit=net-close /usr/local/sbin/net-close`
:::

::: punch
수동 토글이 아니라, **만료되는 예외**입니다
:::

::: notes
그러면 apt나 dnf를 어떻게 받아요, 라고 얘기하실 수 있어요.
물론 받을 때만 잠시 켤 수도 있어요.

그런데 제일 깊은 격리는 방화벽 규칙이 아니라 compose 한 줄입니다.
여기 보시면 app하고 data 네트워크에 internal: true.
이 한 줄이 아웃바운드를 끊습니다.
was는 edge에 없으니까 나갈 길이 아예 없고요. db는 가장 깊은 자리에 있습니다.

주의하실 건, edge에 같이 붙이는 순간 무효입니다.
망 두 개에 붙으면 나갈 수 있는 쪽으로 나가거든요.

그리고 가끔은 나가야 해요.
그때는 타이머를 같이 겁니다. 15분 뒤에 자동으로 닫히게요.
수동 토글이 아니라 만료되는 예외입니다.
:::

## [04]{.keycap} 인증서 갱신 때문에 다 열어둡니다 {.center .fit}

::: {.callout .caution}
예전엔 **회계연도마다 한 번** 사서 갱신하면 끝이었습니다. \
수명이 **200일 → 100일 → 47일**로 줄고 서비스까지 늘면 사람 손으로는 못 합니다 → LE(Let's Encrypt) \
그런데 **HTTP-01 은 LE 가 어디서 검증하러 올지 모릅니다** \
— 출발지 IP 를 일부러 공개하지 않고, **여러 지점에서 동시에** 확인합니다. **ACL 에 넣을 대상이 없습니다**
:::

::: {.callout .danger}
그래서 **80/443 을 전 세계에 열어 둡니다** — 공인 IP 에 ACL 로 좁혀 두려던 게 도로아미타불
:::

::: {.callout .done}
**DNS-01 은 인바운드가 아예 필요 없습니다.** TXT 레코드만 쓰면 되니 **ACL 을 그대로 둡니다**.  
와일드카드도 DNS-01 에서만 나옵니다. compose 안에서는 **caddy만** 아웃바운드 허용
:::

::: {.callout .notice}
대신 **DNS 쪽 부담**이 생깁니다 — 그런데 **`_acme-challenge` 만 위임**받으면 됩니다. \
존 전체를 맡지도, 부서가 DNS 서버를 운영하지도 않습니다. 토큰 권한도 **그 레코드 하나**로 좁힙니다
:::

::: punch
**DNS-01 + 와일드카드** — 앱이 늘어도 발급 이벤트는 안 늘어납니다
:::

::: notes
인증서 얘기도 하나 드릴게요.

예전에는 회계연도마다 한 번 사서 갱신하면 끝이었어요.
그런데 인증서 수명이 200일, 100일, 47일로 계속 줄어듭니다.
서비스까지 늘면 사람 손으로는 못 해요. 그래서 다 Let's Encrypt로 갑니다.

그런데 HTTP-01 방식은, Let's Encrypt가 어디서 검증하러 올지를 몰라요.
출발지 IP를 일부러 공개를 안 합니다. 그리고 여러 지점에서 동시에 확인을 해요.
그러니까 ACL에 넣을 대상이 없어요.
그래서 결국 80하고 443을 전 세계에 열어두게 됩니다.
공인 IP에 ACL로 좁혀두려던 게 도로아미타불이 되는 거예요.

DNS-01로 하면 인바운드가 아예 필요 없습니다.
TXT 레코드만 쓰면 되니까 ACL을 그대로 둬도 돼요.
와일드카드도 DNS-01에서만 나오고요.

DNS 쪽 부담이 생기는 것 아니냐 하실 텐데,
_acme-challenge 그거 하나만 위임받으면 됩니다.
존 전체를 맡는 것도 아니고, 부서가 DNS 서버를 운영하는 것도 아니에요.
토큰 권한도 그 레코드 하나로 좁힙니다.

퇴사자 계정이 남고, 권한 추적이 안 돼요.

그래서 기관 IdP 밑에 부서 레벨로 authentik을 하나 두면,

오래된 연구SW가 신규 OS를 지원 안하는 경우 - **못 고치면 감쌉니다**
:::

::: notes
마지막으로 하이퍼바이저를 안 만지시는 경우가 있어요.
방화벽을 게스트 안에만 겁니다.
그러면 게스트가 침해됐을 때 방어선이 같이 넘어가요.

Proxmox 방화벽은 VM 바깥에 있습니다. 게스트 안에서 root를 먹어도 못 풉니다.

정책이 적용된 VM 템플릿으로 찍어내면, 그게 곧 클론하면 정책이 승계되는 거고요.
계정이나 암호 분실하면 cloud-init 설정 갱신하고 부팅하면 새 정보로 접속이 됩니다.
SSH는 관리 대역만 열고 키 전용으로 하는데, noVNC 콘솔이 있으니까 잠길 일이 없어요.

오래된 연구 소프트웨어가 신규 OS를 지원 안 하는 경우가 많잖아요.
못 고치면 감싸면 됩니다.
:::

## 우리는 어디까지 약속해야 할까요? {.fit}

| 과장된 약속 | 검증 가능한 약속 |
|---|---|
| 침입을 막습니다 | 공격자가 **목적지를 임의로 고를 수 없습니다** |
| 탈취물이 못 나갑니다 | 앱마다 데이터 접근권한을 좁힙니다 |
| 앱이 안전합니다 | 침해된 앱을 격리하고 복구할 수 있습니다 |
| 전부 **추적됩니다** | 접근 로그는 **항상** 남고 **다른 기계로** 보냅니다.<br>**OIDC 를 거친 경로**에는 거기에 **누가**까지 붙습니다<br><small>caddy log_append auth_sub {http.request.header.X-Auth-Request-User}</small> |

::: ref
[github.com/KREONET/caddy-xproxy](https://github.com/KREONET/caddy-xproxy) — `conf.d/00-log-auth.caddy` (MIT)
:::

::: notes
약속을 어디까지 할 수 있냐, 라고 하면.

보통 우리나라 지침에서 내려온 건
침입을 막으라, 탈취물을 못 나가게 하라, 앱이 안전하다는 걸 보증하라, 이런 거거든요.
불가능합니다.
검증할 수 있는 정도로만 걸어야지, 이상론적으로 하면 누가 그걸 못해요.
근데 이상론이 안 되니까 현실이잖아요.

못 해도 하게 하려면, 공격자가 나가는 곳을 한정하라.
그러면 걔만 감시하고 있으면 되거든요.
탈취물을 못 나가게 하라가 아니라,
앱마다 데이터 접근권한을 다르게 줄 수 있게 하고,
그게 좀 복잡하지 않게 해줬으면 좋겠다.

앱이 털려서 해킹이 된다. 복구만 잘하면 돼요.
요즘에는 리버트하는 게 되게 쉬워서, 복구를 편하게 해둔다,
아니면 앱 설치를 편하게 해준다.
이 정도만으로 적정 기술로도 안전하게 앱을 굴릴 수가 있어요.

이 정도로 약속을 해야지, 빡빡하게 해서 하는 약속은 누가 지킬 수가 없습니다.

그리고 로그는 항상 남고 다른 기계로 보냅니다.
OIDC를 거친 경로에는 거기에 누가까지 붙고요.
:::


## 우리는 무엇을 제어할 수 있나요? — 4개 통제 지점 {.fit .key}

| 통제 지점 | 안 해도 되는 것 | 플랫폼이 대신 하는 일 |
|---|:-:|---|
| **입구** | [01]{.keycap} [05]{.keycap} [06]{.keycap} [07]{.keycap} | 조직 IP 대역만 + 인증 프록시(SSO) + HTTPS 자동 |
| **출구** | [02]{.keycap} [04]{.keycap} | 컨테이너 아웃바운드 전면 차단, 지정 프록시만 |
| **빌드** | [03]{.keycap} | **허용된 프록시** 경유로만 패키지 수급, 고정 태그·digest 만 |
| **기록** | [08]{.keycap} [09]{.keycap} | 접근·배포·변경 전부 자동 기록. 정답은 Git, 임의 수정 시 자동 복구 |

앱은 `my_app.my_team.my_company.net` 에 생성됩니다

::: punch
2부는 **열 개를 외우라는** 얘기였습니다. \
이건 **그걸 각자 안 해도 되게** 하는 얘기입니다
:::

::: notes
그래서 제가 앞서 말씀드렸던 그 지점을 얘기를 하면 4개예요.

저희가 제어를 하거나 통제를 해야 될 부분이 4개인데,
들어오는 거, 나가는 거,
그리고 얘가 들어와서 패키지 당겨서 빌드 칠 때.
왜냐하면 지난번에 xz 백도어가 빌드 칠 때 그 테스트 스크립트를 타고 들어왔거든요.
그리고 만약에 사건이 터졌을 때 모니터링 로그가 제대로 남느냐.

이 네 가지를 통제하면 된다고 저는 생각을 합니다.

2부는 열 개를 외우라는 얘기였는데,
이건 그걸 각자 안 해도 되게 하는 얘기입니다.
:::


## 쓰는 분이 알아야 할 건 한 문장입니다 {.fit}

::: {.callout .done}
### 「내부 Git 의 **앱 베이스를 클론해서** 만드세요」
:::

| | 앱 만드는 사람이 하는 일 |
|:-:|---|
| **1** | 목적에 맞는 **앱 베이스를 고른다** — 목록에서 |
| **2** | `git clone` |
| **3** | **자기 기능만** 만든다 — 로그인 · HTTPS · 접근제어는 **손대지 않는다** |
| **4** | `git push` → 자동 배포. `my_app.my_team.my_company.net` 에 뜬다 |
| **5** | 동료에게 **주소만** 보낸다. 로그인은 **기관 계정 그대로** |

::: punch
미리 지정된 통제 지점을, 쓰시는 분은 **고르고, 클론하고, 올리면** 됩니다
:::

::: notes
이것도 복잡해요. 복잡하면 어떻게 하냐.

그런 프로파일들이랑 그런 설계 사상을 깃으로 만들어 놔요.
그리고 하시는 분들은 "이 앱 베이스를 클론해서 만드세요"라고 하면
이 모든 설계 사상이 들어가 있게 하는 겁니다.

그래서 이걸 클론해서 디플로이를 하면
my_app.my_team.my_company.net 이라는 데 앱이 뜨게 되는 거예요.
그리고 이 앱이 뜰 때는 그 설계 사상에 맞춰서,
통제 지점에 맞게 인스턴스가 뜨게 되는 겁니다.

그러니까 앞에 있는 그런 거 다 떼고,
베이스 고르고, 클론하고, 자기 기능만 만들어서 올리면 됩니다.
동료한테는 주소만 보내면 되고, 로그인은 기관 계정 그대로예요.
:::


## 관리자가 한 번 해두는 일 {.fit}

목적별로 **빈 앱 베이스**를 만들어 둡니다. 프리셋이 박힌 채로

|---|---|:-:|

## 입사일 이전 메일이 검색되시나요?<br><small>가장 오래된 손잡이 — 메일링 리스트와 아카이브</small> {.fit}

::: punch
저는 2013년에 들어간 회사에서, 입사 전 우리 팀 메일이 전부 검색됐습니다
:::

- 팀 메일주소로 오간 것이면 **내가 오기 전 것도** 보입니다
- **다른 팀에 뭘 부탁하는 메일**에도 우리 팀 주소를 넣습니다. 선임자도 그렇게 했고요
- 그래서 신입도 알 수 있었습니다 — 저 팀엔 **누구를 통해, 어떤 순서로, 어떤 어투로** 요청하는지
- To 에 팀메일을 안 넣으면 혼났습니다. \
  이유는 보안이 아니라 *"나중에 다른 사람이 이 일을 못 이어받아서"*

::: punch
인수인계 문서는 결론을 알려주지만, 스레드는 **일하는 방식**을 알려줍니다
:::

::: {.callout .info}
사기업은 사람이 나가는 것을 전제로 기록을 설계합니다
:::

::: notes
저는 입사 전에, 10년 전에 사기업에 있었거든요.
거기서 있었던 경험을 하나 여쭤볼게요.
입사일 이전에 메일이 검색되시나요? 본인 회사 시스템에서요.

저는 2013년도에 들어갔던 회사에서,
입사 전에 저희 팀 사이에서 보낸 메일이 검색이 됐습니다.

다른 팀 차장님한테 뭘 부탁하려고 하면 우리 팀 주소를 넣어요.
그쪽도 그쪽 팀 주소를 넣습니다. 팀 대 팀으로 일을 하거든요.
그러면 어떤 게 생기냐면,
저 팀의 누구한테는 어떤 순서로, 어떤 어투로 물어봐야 되는지가
그 메일링 리스트에 있어요.

그런데 제가 대학원 석사 때 하던 것처럼
개인한테 보내고 관련된 사람들은 그냥 CC에 넣고, 이렇게 했거든요.
팀장한테 엄청 혼났습니다.
왜 혼났냐면, 보안 때문이 아니라,
나중에 다른 사람이 이어서 받아서 해야 되는데
왜 팀 메일링 리스트 아카이브에 남지 않게 일을 하냐, 이런 식으로요.

인수인계 문건은 결론을 알려줘요.
근데 메일링 스레드 자체는, 핑퐁 됐던 그 모든 기록은 일하는 방식을 알려줍니다.
그리고 그 스레드 자체가 주소로 하나씩 박혀요.

사기업은 사람이 나가는 걸 전제로 일을 하는 것 같아요.
결론만 남기지 않고 그 과정은 전부 다 남기면서 일을 하고 있습니다.
:::

## 그런데 과분류는 여전히 공짜입니다 {.key}

누가 O로 그 자료를 판단하겠어요. 다 C로 하지.
C로 하고 나서 사고가 일어났다, 그러면
"어쩔 수 없이 헤비하게 준비했는데도 어쩔 수 없구나" 하고 넘어가겠는데,
O로 했다, 근데 사고 터졌다. 그러면 분류를 한 그 사람이 손해 보는 케이스예요.
차라리 정보를 안 다루고 말지.

게다가 옛날에는 국정원만 했었습니다.
근데 2024년도에 감사원 디지털감사국이 생겼어요.
그리고 출연연을 보기 시작합니다. 시어머니가 둘이에요.
그리고 현장은 가장 엄한 쪽에 맞춰야 됩니다.

기준을 합치자는 게 아니에요.
O로 찍어도 안전하게 할 수 있는 장치를 마련해 주셔야 합니다.
그래야지 사람이 O로 찍고, O에 해당하는 애플리케이션 만들면서 혁신이 일어나는 거예요.
:::

## ① 총량제 집계 단위를 바꿔주십시오 {.fit}

- **현행** — 호스트명(서브도메인) 수로 집계
- **문제** — 서브도메인 분리는 **브라우저의 보안 경계**입니다. 서브URI로 묶으면 origin을 공유해 쿠키·세션이 섞이고, 한 앱의 XSS가 나머지를 가져갑니다
- **제안 ㉠** — **독립적으로 운영·패치·폐기되는 관리 주체 수**로
- **제안 ㉡** — 폐지 도메인은 반납이 아니라 **경로를 보존하는 301 + 유효한 인증서** 유지 의무로
- **소관** — 행정안전부 가이드 개정 *(법 개정 아님)*

::: {.callout .danger}
**3부에서 보신 그 플랫폼은 앱마다 서브도메인을 발급합니다.** \
총량제 밑에서는 — **안전하게 만들수록 총량을 먹습니다**
:::

::: punch
**지금 지표는 안전한 구조에 벌점을 줍니다**
:::

::: notes
첫 번째, 총량제 집계 단위를 바꿔주십시오.

지금은 호스트명, 그러니까 서브도메인 수로 셉니다.
그런데 서브도메인을 나누는 건 브라우저의 보안 경계예요.
서브URI로 한 도메인에 여러 앱을 묶으면 origin을 공유하기 때문에
쿠키하고 세션이 섞입니다. 한 앱에서 XSS가 터지면 나머지를 다 가져가요.

그러니까 독립적으로 운영되고, 패치되고, 폐기되는
관리 주체 수로 세주셨으면 좋겠습니다.

그리고 폐지하는 도메인은 반납이 아니라,
경로를 보존하는 301하고 유효한 인증서를 유지하는 의무로 바꿔주십시오.
아까 질병관리청이 그래서 끊긴 겁니다.

소관은 행정안전부 가이드 개정입니다. 법 개정이 아니에요.

3부에서 보신 그 플랫폼은 앱마다 서브도메인을 발급하거든요.
총량제 밑에서는 안전하게 만들수록 총량을 먹습니다.
지금 지표는 안전한 구조에 벌점을 주고 있어요.
:::


## ② 정적 호스팅은 별도 등급으로

- 서버 사이드 로직 없음 · DB 없음 · 사용자 입력 없음 · **전부 공개 예정 정보**
- 침해 시 피해는 **콘텐츠 변조**. **유출할 데이터가 존재하지 않습니다**
- 그런데 현행은 동적 웹 서비스와 **동일한 절차**를 요구합니다

::: punch
털릴 게 없는 것을 지키느라 털릴 게 있는 것을 못 보고 있습니다
:::

정직하게 붙일 단서 둘 —
**①** 변조 위험은 남습니다(기관 도메인 정적 페이지 = 피싱 랜딩). 대응은 Git 자동 복구.
**②** 폼 하나·외부 API 하나 붙으면 등급이 달라집니다. **정적 판정 기준**을 함께 제안해야 합니다.

::: notes
두 번째, 정적 호스팅은 별도 등급으로 해주십시오.

서버 사이드 로직 없고, DB 없고, 사용자 입력 없고, 전부 공개될 정보예요.
침해돼도 피해는 콘텐츠 변조입니다. 유출할 데이터가 아예 존재하지 않아요.
그런데 지금은 동적 웹 서비스하고 똑같은 절차를 요구합니다.

털릴 게 없는 걸 지키느라 털릴 게 있는 걸 못 보고 있는 거예요.

정직하게 단서 두 개는 붙이겠습니다.
하나, 변조 위험은 남아요. 기관 도메인에 정적 페이지면 피싱 랜딩으로 쓰일 수 있거든요.
대응은 Git에서 자동 복구하는 겁니다.
둘, 폼 하나나 외부 API 하나 붙으면 등급이 달라집니다.
그래서 정적 판정 기준을 같이 제안해야 돼요.

## ⑧ 그럼 이 부품들은 누가 봅니까 {.fit .skip}

참조구현을 **퍼뜨리는 순간**, 그 부품이 **모든 기관의 급소**가 됩니다

| 부품 | 터지면 |
|---|---|
| **Caddy** <sup>리버스 프록시 · TLS</sup> | **입구**가 통째로 |
| **oauth2-proxy · authentik** <sup>OIDC</sup> | **인증**이 통째로 |
| **BIND9** <sup>DNS-01 챌린지</sup> | **인증서 발급**이 통째로 |
| **squid** <sup>허용목록 프록시</sup> | **빌드 경로**가 통째로 |
| **Docker · containerd · RKE2** | **격리**가 통째로 |

::: {.callout .caution}
부품 하나에 취약점 소식이 나면 **그 위에 선 전부가 흔들립니다.** \
이 참조구현은 **Caddy** 로 짰습니다 — 그럼 **Caddy 가 안 터져야** 합니다.
**DNS-01** 을 쓰기로 했으면 **BIND9 도 안전하게 관리돼야** 합니다
:::

::: punch
**Trusted CI 가 Jupyter · Singularity · Tapis 에 한 일이 정확히 이겁니다**
:::

::: notes
그럼 이 부품들은 누가 봅니까.

참조구현을 퍼뜨리는 순간, 그 부품이 모든 기관의 급소가 됩니다.

Caddy 터지면 입구가 통째로 가고, authentik 터지면 인증이 통째로 가고,
BIND9 터지면 인증서 발급이, squid 터지면 빌드 경로가,
도커나 RKE2 터지면 격리가 통째로 갑니다.

부품 하나에 취약점 소식이 나면 그 위에 선 전부가 흔들려요.
이 참조구현은 Caddy로 짰습니다. 그럼 Caddy가 안 터져야 돼요.
DNS-01을 쓰기로 했으면 BIND9도 안전하게 관리돼야 하고요.

Trusted CI가 Jupyter하고 Tapis에 한 일이 정확히 이겁니다.
:::
