<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="552" viewBox="0 0 1280 552" font-family="Apple SD Gothic Neo, Pretendard, Noto Sans KR, sans-serif">
  <rect width="1280" height="552" fill="#ffffff"/>


  <!-- column labels -->
  <text x="48"  y="46" font-size="15" font-weight="700" fill="#9ca3af" letter-spacing="1">미국</text>
  <text x="470" y="46" font-size="15" font-weight="700" fill="#9ca3af" letter-spacing="1">국내 양대 백본</text>
  <text x="930" y="46" font-size="15" font-weight="700" fill="#9ca3af" letter-spacing="1">각 기관 뉴스서버 (당시 표현 &quot;2차&quot;)</text>

  <!-- US nodes -->
  <g>
    <rect x="48" y="66" width="330" height="72" rx="10" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="70" y="96" font-size="17" font-weight="600" fill="#111827">NASA</text>
    <text x="70" y="121" font-size="15" fill="#4b5563" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">news.arc.nasa.gov</text>

    <rect x="48" y="150" width="330" height="72" rx="10" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="70" y="180" font-size="17" font-weight="600" fill="#111827">UC 버클리</text>
    <text x="70" y="205" font-size="15" fill="#4b5563" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">agate.berkeley.edu</text>

    <rect x="48" y="288" width="330" height="72" rx="10" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="70" y="318" font-size="17" font-weight="600" fill="#111827">로렌스 버클리 연구소</text>
    <text x="70" y="343" font-size="15" fill="#4b5563" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">overload.lbl.gov</text>
  </g>

  <!-- arrows US -> backbone -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <path d="M378,102 C424,102 424,122 466,122" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M378,186 C424,186 424,142 466,142" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M378,324 C424,324 424,314 466,314" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- backbones -->
  <rect x="470" y="80" width="400" height="90" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="496" y="113" font-size="19" font-weight="700" fill="#1e3a8a">하나망 뉴스서버</text>
  <text x="496" y="142" font-size="16" fill="#1d4ed8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">usenet.hana.nm.kr</text>
  <text x="496" y="162" font-size="13" fill="#64748b">지금은 사라짐</text>

  <rect x="470" y="272" width="400" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="496" y="305" font-size="19" font-weight="700" fill="#1e3a8a">연구망(KREONET) 뉴스서버</text>
  <text x="496" y="334" font-size="16" fill="#1d4ed8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">news.kreonet.re.kr</text>
  <text x="496" y="354" font-size="13" fill="#64748b">1994 ~ 2009</text>

  <!-- backbone <-> backbone -->
  <path d="M670,170 L670,272" stroke="#2563eb" stroke-width="2.5" fill="none" marker-start="url(#b)" marker-end="url(#b)"/>
  <rect x="560" y="200" width="220" height="42" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="670" y="227" font-size="15" font-weight="600" fill="#1d4ed8" text-anchor="middle">받은 글은 즉시 서로 공유</text>

  <!-- arrows backbone -> secondary -->
  <path d="M870,125 C900,125 900,200 928,200" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M870,317 C900,317 900,244 928,244" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- secondary -->
  <rect x="930" y="66" width="302" height="312" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="956" y="105" font-size="17" fill="#111827">서울대</text>
  <text x="956" y="143" font-size="17" fill="#111827">KAIST</text>
    <text x="1082" y="143" font-size="13" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">news.kaist.ac.kr</text>
  <text x="956" y="181" font-size="17" fill="#111827">포항공대</text>
  <text x="956" y="219" font-size="17" fill="#111827">서강대</text>
  <text x="956" y="257" font-size="17" fill="#9ca3af">…</text>
  <line x1="956" y1="282" x2="1206" y2="282" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="956" y="314" font-size="15" fill="#4b5563">각 기관 연구자는</text>
  <text x="956" y="340" font-size="15" fill="#4b5563">자기 기관 서버만 봅니다</text>

  <!-- bottom note -->
  <rect x="48" y="400" width="1184" height="112" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="74" y="432" font-size="17" font-weight="600" fill="#92400e">글 하나를 올리면, 그 글은 지워지는 게 아니라 복사되어 퍼집니다.</text>
  <text x="74" y="458" font-size="16" fill="#a16207">그래서 서버 한 대가 죽어도 글은 남습니다 — 어딘가에 다른 사본이 있는 한.</text>
  <text x="74" y="490" font-size="14" fill="#a16207" opacity="0.85">유즈넷에 상하는 없습니다. 서버끼리 대등하게 &quot;피어&quot;로 맺습니다 — 이 모양은 1994년에 국제회선을 가진 곳이 둘뿐이라서 생긴 것입니다.</text>
</svg>
